# Example --topology-conf exercising the topology extra_expect channel and its
# cross-driver parity gate (docs/tech-debt.md TD-11). Pairs with the bash driver's
# topology.d/examples/extra-expect-parity.conf: BOTH declare the SAME bare key=value
# tokens, diffed by build-test.yml so the two hand-mirrored confs cannot drift.
