# Example --topology-conf for the first-class `lwip-tap` topology (the lwIP DUT —
# a real embedded TCP/IP stack, not the Linux reference DUT — on a host tap).
#
# lwip-tap is ZERO-CONF: it hardcodes its wire identity (tap tc8lwip0, tester
# 172.16.0.1, DUT 172.16.0.2) and the opcode Upper Tester readiness probe, so the
# default sweep needs NO --topology-conf at all:
#
#   sudo dut/env/orchestrator/target/debug/tc8-orchestrator \
#        --topology lwip-tap \
#        ICMPv4_TYPE_08 UDP_INTRODUCTION_03 TCP_BASICS_01
# Expected: 3x PASS. Full sweep + per-case known-fail rationale: dut/lwip_dut/README.md.
#
# This file exists only to document the optional [lwip] override knobs. Uncomment to
# point the topology at a different binary / readiness probe / teardown process name
# (see lwip-utm-tap.toml for the standalone-UTM variant that uses them).

# [lwip]
# app = "${ROOT}/build-lwip-dut/tc8-lwip-dut"   # default
# ready_probe = "opcode"                          # opcode (UT OpPing) | testability
# kill_name = "tc8-lwip-dut"                      # default
