# Standalone AUTOSAR Testability UTM (tc8-lwip-utm) on the lwip-tap topology — the
# typed Rust successor to dut/env/topology.d/examples/lwip-utm-tap.conf.
#
# Same tap provisioning + per-case respawn as the default lwip-tap topology, but
# driving the standalone testability UTM (no in-house opcode UT). The [lwip] section
# overrides three knobs off their defaults:
#   * app         — the UTM binary;
#   * ready_probe — testability GET_VERSION (the UTM serves no opcode channel for
#                   ut-ping to reach);
#   * kill_name   — the UTM process name for the teardown pkill.
#
# Build: cmake --build build-lwip-dut -j4   # produces tc8-lwip-utm
# Run (as root):
#   sudo dut/env/orchestrator/target/debug/tc8-orchestrator \
#        --topology lwip-tap \
#        --topology-conf dut/env/orchestrator/examples/lwip-utm-tap.toml \
#        --dut-control testability \
#        TCP_BASICS_01 TCP_CALL_ABORT_02

[lwip]
app = "${ROOT}/build-lwip-dut/tc8-lwip-utm"
ready_probe = "testability"
kill_name = "tc8-lwip-utm"
