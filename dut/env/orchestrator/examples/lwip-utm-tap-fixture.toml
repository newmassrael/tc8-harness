# Standalone AUTOSAR Testability UTM (tc8-lwip-utm) on the lwIP tap fixture — the
# typed Rust successor to dut/env/topology.d/examples/lwip-utm-tap-fixture.conf.
#
# Same tap provisioning + per-case respawn as lwip-tap-fixture.toml, but driving the
# standalone testability UTM (no in-house opcode UT). Three fields differ:
#   * lwip_app         — the UTM binary;
#   * lwip_ready_probe — testability GET_VERSION (the UTM serves no opcode channel
#                        for ut-ping to reach);
#   * lwip_kill_name   — the UTM process name for the teardown pkill.
#
# Build: cmake --build build-lwip-dut -j4   # produces tc8-lwip-utm
# Run (as root):
#   sudo dut/env/orchestrator/target/debug/tc8-orchestrator \
#        --topology external \
#        --topology-conf dut/env/orchestrator/examples/lwip-utm-tap-fixture.toml \
#        --dut-control testability \
#        TCP_BASICS_01 TCP_CALL_ABORT_02

iface = "tc8lwip0"
dut_ip = "172.16.0.2"
tester_ip = "172.16.0.1"

[fixture]
kind = "lwip-tap"
lwip_app = "${ROOT}/build-lwip-dut/tc8-lwip-utm"
lwip_ready_probe = "testability"
lwip_kill_name = "tc8-lwip-utm"
