[package]
name = "tc8-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Test orchestrator for the TC8 conformance harness — the Rust successor to dut/env/smoke-test.sh. Drives the harness against per-topology DUTs (single-pc netns, external, ssh-remote), aggregates verdicts, and emits JUnit. Built incrementally (strangler) alongside the bash original."

[[bin]]
name = "tc8-orchestrator"
path = "src/main.rs"

# Dependencies are added per stage as they are first used, keeping
# `cargo clippy` warning-free (no unused crates).
[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# DUT wire identity is derived from the DUT's own vsomeip.json (single source)
# rather than re-hardcoded — see config::DutIdentity.
serde_json = "1"
# Run worker teardown on SIGINT/SIGTERM (Ctrl-C, CI cancel) so an interrupted
# run does not leak netns/processes — the analogue of bash `trap cleanup EXIT`.
# `ctrlc` is the purpose-built abstraction for "clean up on termination"; the
# `termination` feature extends the handler to SIGTERM/SIGHUP, not just SIGINT.
ctrlc = { version = "3", features = ["termination"] }
# Site topology config (`--topology-conf`) is TOML — the typed, parse-checked
# successor to the bash sourced-fragment channel (TC8_TOPOLOGY_* assignments that
# sudo's env_reset stripped). `serde` derives the schema; `toml` parses it.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 2
