# Standalone AUTOSAR Testability UTM (tc8-lwip-utm) on the 'external'
# topology — the lwIP testability server WITHOUT the in-house opcode UT.
# Verifies that the standalone UTM brings the lwIP stack up and binds the
# testability endpoint (UDP 30700) on a real tap, driven by the
# --dut-control testability seam cases.
#
# Build the UTM (alongside the conformance DUT):
#   cmake --build build-lwip-dut -j4   # produces tc8-lwip-utm
#
# Run:
#   sudo dut/env/smoke-test.sh --topology external \
#        --topology-conf dut/env/topology.d/examples/lwip-utm-tap-fixture.conf \
#        --dut-control testability \
#        TCP_BASICS_01 TCP_CALL_ABORT_02
#
# Reuses lwip-tap-fixture.conf wholesale (tap provisioning, lock, per-case
# respawn, drain ordering). Only three things differ from the conformance
# DUT, set BEFORE sourcing so the shared conf picks them up:
#   * LWIP_APP        — the standalone UTM binary;
#   * LWIP_READY_PROBE — testability GET_VERSION (the UTM has no opcode UT
#                        for ut-ping to reach);
#   * LWIP_KILL_NAME   — the UTM process name for the teardown pkill.
LWIP_APP=$ROOT/build-lwip-dut/tc8-lwip-utm
LWIP_READY_PROBE=testability
LWIP_KILL_NAME=tc8-lwip-utm
source "$(dirname "${BASH_SOURCE[0]}")/lwip-tap-fixture.conf"
