# Self-contained verification fixture for the 'external' topology.
# Run:
#   sudo dut/env/smoke-test.sh --topology external \
#        --topology-conf dut/env/topology.d/examples/external-netns-fixture.conf \
#        ICMPv4_TYPE_08 UDP_INTRODUCTION_03
# Expected: PASS + PASS; DHCPv4_CLIENT_USAGE_01 added to the list lands
# as an explicit SKIP (no secondary interface configured here).
#
# Verification fixture for the 'external' topology profile.
# Provisions a persistent "external DUT": the reference tc8-dut inside
# an isolated netns, with the tester-side veth left in the root
# namespace — exactly the surface a real target ECU presents to the
# tester host. Sourced as root by smoke-test.sh via --topology-conf.
FIX_NS=tc8-extfix-dut
FIX_DIR=/tmp/tc8-extfix

TC8_TOPOLOGY_IFACE=veth-extfix-t
TC8_TOPOLOGY_DUT_IP=172.16.0.2
TC8_TOPOLOGY_TESTER_IP=172.16.0.1

# Stand up the fake external DUT in the run-level hook — NOT at source time: a
# sourced .conf should declare config + define hooks, never execute host setup as a
# side effect of being read (sourcing this for `--print-expect` must stay clean +
# unprivileged). Spawns the netns + veth + reference tc8-dut, settles, then verifies
# liveness via the profile's shared helper (SSOT — the same check the real-DUT
# provision_run runs).
topology_provision_run() {
    pkill -KILL -f "$FIX_DIR/tc8-dut" 2>/dev/null || true
    ip netns del "$FIX_NS" 2>/dev/null || true
    ip link del veth-extfix-t 2>/dev/null || true
    rm -rf "$FIX_DIR"
    mkdir -p "$FIX_DIR"
    ip netns add "$FIX_NS"
    ip link add veth-extfix-t type veth peer name veth-extfix-d
    ip link set veth-extfix-d netns "$FIX_NS"
    ip addr add 172.16.0.1/24 dev veth-extfix-t
    ip link set veth-extfix-t up
    ip netns exec "$FIX_NS" ip addr add 172.16.0.2/24 dev veth-extfix-d
    ip netns exec "$FIX_NS" ip link set veth-extfix-d up
    ip netns exec "$FIX_NS" ip link set lo up
    # Pin a /32 host route to the DUT via our own veth so a foreign interface
    # squatting the shared 172.16.0.0/24 (e.g. an orphan persistent tap on
    # 172.16.0.1/24) cannot win the route lookup and black-hole the probe.
    ip route replace 172.16.0.2/32 dev veth-extfix-t
    ln -sf "$ROOT/build/dut/dut_service/tc8-dut" "$FIX_DIR/tc8-dut"
    ip netns exec "$FIX_NS" env \
        COMMONAPI_CONFIG="$CAPI_CFG" \
        VSOMEIP_CONFIGURATION="$VSOMEIP_CFG" \
        VSOMEIP_APPLICATION_NAME=tc8-dut \
        VSOMEIP_BASE_PATH="$FIX_DIR/" \
        "$FIX_DIR/tc8-dut" >"$FIX_DIR/dut.log" 2>&1 &
    disown
    sleep 1.5   # DUT boot settle before the liveness probe
    _external_verify_dut_live
}

# Reap the fixture netns DUT this overlay owns (the profile's teardown_run is a
# no-op — a real external DUT belongs to the operator).
topology_teardown_run() {
    pkill -KILL -f "/tmp/tc8-extfix/tc8-dut" 2>/dev/null || true
    ip route del 172.16.0.2/32 dev veth-extfix-t 2>/dev/null || true
    ip netns del tc8-extfix-dut 2>/dev/null || true
    ip link del veth-extfix-t 2>/dev/null || true
    rm -rf /tmp/tc8-extfix
}
