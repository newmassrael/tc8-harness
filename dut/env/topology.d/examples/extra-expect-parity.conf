# Example --topology-conf exercising the topology extra_expect channel and its
# cross-driver parity gate (docs/tech-debt.md TD-11). Pairs with the orchestrator's
# examples/extra-expect-parity.toml: BOTH declare the SAME bare key=value tokens, and
# build-test.yml diffs the two drivers' --print-expect over this pair so the two
# hand-mirrored confs (bash array here vs Rust .toml list there) cannot silently drift.
#
# extra_expect is topology-agnostic (it folds into the common --expect surface for any
# topology); the gate runs it over the zero-conf lwip-tap topology so --print-expect
# stays unprivileged. Sourced clean — declares config only, NO host side effects.
#
# The keys are real registry entries (src/cli/tc8_expect_keys.def) of the kind a
# topology supplies that vsomeip.json cannot: timing / endpoint constants.
TC8_TOPOLOGY_EXTRA_EXPECT=(
    "can_start_offset_ms=1000"
    "tester_udp_port=51712"
)
