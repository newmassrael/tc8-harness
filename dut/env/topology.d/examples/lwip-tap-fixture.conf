# Self-contained verification fixture for the 'external' topology with
# the lwIP DUT (dut/lwip_dut/ — a real embedded TCP/IP stack, not the
# Linux reference DUT).
#
# Build the DUT once:
#   git clone --depth 1 https://github.com/lwip-tcpip/lwip.git /tmp/lwip
#   cmake -S dut/lwip_dut -B build-lwip-dut -DLWIP_DIR=/tmp/lwip \
#         -DCMAKE_BUILD_TYPE=Release
#   cmake --build build-lwip-dut -j4
#
# Run:
#   sudo dut/env/smoke-test.sh --topology external \
#        --topology-conf dut/env/topology.d/examples/lwip-tap-fixture.conf \
#        ICMPv4_TYPE_08 UDP_INTRODUCTION_03 TCP_BASICS_01
# Expected: 3x PASS. The full supported sweep and the per-case
# known-fail rationale live in dut/lwip_dut/README.md +
# dut/lwip_dut/inventory_overrides.json.
#
# Provisions a host tap interface (the lwIP unix-port tapif driver
# attaches to it via PRECONFIGURED_TAPIF) and starts one persistent
# tc8-lwip-dut. The lwIP stack answers ARP/ICMP/IP/UDP/TCP itself and
# serves the Upper Tester on UDP 30600. Sourced as root by
# smoke-test.sh via --topology-conf.

LWIP_APP=${LWIP_APP:-$ROOT/build-lwip-dut/tc8-lwip-dut}
LWIP_FIX_DIR=/tmp/tc8-lwipfix
LWIP_TAP=tc8lwip0

if [[ ! -x "$LWIP_APP" ]]; then
    echo "lwip-tap-fixture: DUT binary '$LWIP_APP' not found — build it first (see header of this conf)" >&2
    exit 1
fi

pkill -KILL -f "$LWIP_APP" 2>/dev/null || true
ip link del "$LWIP_TAP" 2>/dev/null || true
rm -rf "$LWIP_FIX_DIR"
mkdir -p "$LWIP_FIX_DIR"

ip tuntap add dev "$LWIP_TAP" mode tap
ip addr add 172.16.0.1/24 dev "$LWIP_TAP"
ip link set "$LWIP_TAP" up

# Stimulus-suppression iptables leaks from killed prior runs need no
# fixture-side handling: the harness RAIIs install every rule inside
# the dedicated `tc8-stimulus` chain and smoke-test.sh flushes that
# chain at worker bring-up (shape-agnostic, all topologies).

setsid env \
    PRECONFIGURED_TAPIF="$LWIP_TAP" \
    TC8_LWIP_DUT_IP=172.16.0.2 \
    TC8_LWIP_DUT_MASK=255.255.255.0 \
    TC8_LWIP_DUT_GW=172.16.0.1 \
    "$LWIP_APP" >"$LWIP_FIX_DIR/dut.log" 2>&1 </dev/null &
disown
sleep 1

TC8_TOPOLOGY_IFACE=$LWIP_TAP
TC8_TOPOLOGY_DUT_IP=172.16.0.2
TC8_TOPOLOGY_TESTER_IP=172.16.0.1

# Per-case DUT respawn: run_case calls topology_stop_dut unconditionally
# at case teardown. Case stimuli hardcode the UT socket ids a freshly
# spawned DUT hands out (1, 2, ...), and passing cases legitimately
# leave auxiliary sockets open — on a truly persistent DUT the leaked
# slots shift every later case's id sequence (proven by the TCP sweep:
# OpOpenTcpSocket answered sid=3, every follow-up op on the hardcoded
# id 1 collapsed to kStatusUnknownSocket). Respawning here restores the
# per-case fresh-DUT semantics the Linux fixture gets from
# TOPOLOGY_SUPPORTS_DUT_SPAWN=1; the stack re-attaches to the
# persistent tap and keeps the same MAC, so the bring-up-time neigh
# pin stays valid.
topology_stop_dut() {
    pkill -KILL -f "tc8-lwip-dut" 2>/dev/null || true
    # Tester-side socket-state reset, the host-kernel analog of the
    # per-case netns single-pc gets for free: an aux-listener connection
    # from case N leaves a TIME-WAIT on this persistent tester kernel,
    # and case N+1 reusing the same port quad has its opening SYN
    # silently swallowed by that socket (reopen only succeeds for an
    # ISN above the old one — a coin flip with randomised ISNs).
    ss -K dst 172.16.0.2 >/dev/null 2>&1 || true
    setsid env \
        PRECONFIGURED_TAPIF=tc8lwip0 \
        TC8_LWIP_DUT_IP=172.16.0.2 \
        TC8_LWIP_DUT_MASK=255.255.255.0 \
        TC8_LWIP_DUT_GW=172.16.0.1 \
        "$LWIP_APP" >>"/tmp/tc8-lwipfix/dut.log" 2>&1 </dev/null &
    disown
    sleep 1
}

# Fixture teardown rides the profile hook — conf files are sourced after
# the profile, so overriding hooks is supported.
topology_tear_down_worker() {
    pkill -KILL -f "tc8-lwip-dut" 2>/dev/null || true
    ip link del tc8lwip0 2>/dev/null || true
    # Preserve the DUT log for postmortems; the run dir itself goes away.
    mv /tmp/tc8-lwipfix/dut.log /tmp/tc8-lwipfix-last-dut.log 2>/dev/null || true
    rm -rf /tmp/tc8-lwipfix
}
