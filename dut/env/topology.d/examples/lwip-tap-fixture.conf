# Self-contained verification fixture for the 'external' topology with
# the lwIP DUT (dut/lwip_dut/ — a real embedded TCP/IP stack, not the
# Linux reference DUT).
#
# Build the DUT once:
#   git clone --depth 1 https://github.com/lwip-tcpip/lwip.git /tmp/lwip
#   cmake -S dut/lwip_dut -B build-lwip-dut -DLWIP_DIR=/tmp/lwip \
#         -DCMAKE_BUILD_TYPE=Release
#   cmake --build build-lwip-dut -j4
#
# Run:
#   sudo dut/env/smoke-test.sh --topology external \
#        --topology-conf dut/env/topology.d/examples/lwip-tap-fixture.conf \
#        ICMPv4_TYPE_08 UDP_INTRODUCTION_03 TCP_BASICS_01
# Expected: 3x PASS. The full supported sweep and the per-case
# known-fail rationale live in dut/lwip_dut/README.md +
# dut/lwip_dut/inventory_overrides.json.
#
# Provisions a host tap interface (the lwIP unix-port tapif driver
# attaches to it via PRECONFIGURED_TAPIF) and starts one persistent
# tc8-lwip-dut. The lwIP stack answers ARP/ICMP/IP/UDP/TCP itself and
# serves the Upper Tester on UDP 30600. Sourced as root by
# smoke-test.sh via --topology-conf.

# This conf provisions the external-topology fixture and overrides the
# per-case topology_stop_dut hook accordingly. Sourcing it under any
# other topology builds a frankenstate: the fixture lock is taken and
# the tap comes up, but the cases run against the single-pc Linux DUT
# whose per-case workers the overridden kill path never reaps
# (observed 2026-06-11: a --topology-conf-without---topology run
# leaked four tc8-dut workers that held the fixture lock and
# deadlocked the weekly sweep). Refuse early, before any host state.
if [[ "${TOPOLOGY:-}" != "external" ]]; then
    echo "lwip-tap-fixture: this conf is for --topology external (got '${TOPOLOGY:-unset}') — pass both flags together" >&2
    exit 1
fi

LWIP_APP=${LWIP_APP:-$ROOT/build-lwip-dut/tc8-lwip-dut}
LWIP_FIX_DIR=/tmp/tc8-lwipfix
LWIP_TAP=tc8lwip0
LWIP_DUT_IP=172.16.0.2

if [[ ! -x "$LWIP_APP" ]]; then
    echo "lwip-tap-fixture: DUT binary '$LWIP_APP' not found — build it first (see header of this conf)" >&2
    exit 1
fi

# Mutual exclusion: the tap name, the DUT pkill pattern and
# $LWIP_FIX_DIR are host-global, so two concurrent fixture users — a
# CI sweep on the self-hosted runner and a local dev run — silently
# corrupt each other (observed 2026-06-10 as a 4-case failure burst in
# the weekly sweep while a local run rebuilt the fixture). Fail fast
# instead. The lock fd stays open for the smoke-test.sh process
# lifetime and releases on every exit path.
#
# The fd is also inherited by every child smoke-test.sh spawns after
# sourcing this conf. A child that outlives its run keeps the lock
# held with no live owner and deadlocks every later fixture user
# (observed 2026-06-11: leaked workers held it and the weekly sweep
# aborted). Two defenses: the fixture's own DUT spawn closes the fd
# explicitly, and a conflict whose holders include no live
# smoke-test.sh self-heals by reaping the leaked holders (only
# fixture-tree processes ever hold this file) and retrying once.
LWIP_LOCK_FILE=/var/lock/tc8-lwip-fixture.lock
exec {LWIP_LOCK_FD}>"$LWIP_LOCK_FILE"
if ! flock -n "$LWIP_LOCK_FD"; then
    if ! command -v fuser >/dev/null; then
        echo "lwip-tap-fixture: lock $LWIP_LOCK_FILE is held and fuser is unavailable to identify the holder (apt install psmisc) — aborting" >&2
        exit 1
    fi
    lwip_live_owner=""
    lwip_leaked_holders=()
    for _pid in $(fuser "$LWIP_LOCK_FILE" 2>/dev/null | tr -c '0-9' ' '); do
        [[ "$_pid" == "$$" ]] && continue
        if grep -qa 'smoke-test' "/proc/$_pid/cmdline" 2>/dev/null; then
            lwip_live_owner=$_pid
        else
            lwip_leaked_holders+=("$_pid")
        fi
    done
    if [[ -n "$lwip_live_owner" ]]; then
        echo "lwip-tap-fixture: another smoke-test.sh (pid $lwip_live_owner) holds the lwIP fixture (lock $LWIP_LOCK_FILE) — aborting instead of corrupting its run" >&2
        exit 1
    fi
    if ((${#lwip_leaked_holders[@]} == 0)); then
        echo "lwip-tap-fixture: lock $LWIP_LOCK_FILE is held but no holder is visible — aborting" >&2
        exit 1
    fi
    # TERM first, KILL backstop — a leaked tc8-lwip-dut among the
    # holders must get its SIGTERM slot abort (RST to tester halves);
    # SIGKILLing a userspace stack orphans them in FIN-WAIT-2, the
    # exact failure lwip_fixture_kill_dut below exists to prevent.
    echo "lwip-tap-fixture: lock held only by leaked children of a finished run (pid ${lwip_leaked_holders[*]}) — reaping them and retrying" >&2
    kill -TERM "${lwip_leaked_holders[@]}" 2>/dev/null || true
    lwip_lock_ok=0
    for _attempt in $(seq 10); do
        if flock -n "$LWIP_LOCK_FD"; then
            lwip_lock_ok=1
            break
        fi
        sleep 0.05
    done
    if [[ "$lwip_lock_ok" != 1 ]]; then
        kill -KILL "${lwip_leaked_holders[@]}" 2>/dev/null || true
        for _attempt in $(seq 10); do
            if flock -n "$LWIP_LOCK_FD"; then
                lwip_lock_ok=1
                break
            fi
            sleep 0.05
        done
    fi
    if [[ "$lwip_lock_ok" != 1 ]]; then
        echo "lwip-tap-fixture: lock still held after reaping leaked holders — aborting" >&2
        exit 1
    fi
    unset lwip_lock_ok
fi
unset lwip_live_owner lwip_leaked_holders

pkill -KILL -f "$LWIP_APP" 2>/dev/null || true
ip link del "$LWIP_TAP" 2>/dev/null || true
rm -rf "$LWIP_FIX_DIR"
mkdir -p "$LWIP_FIX_DIR"

# Tester-side `<AIface-0-IP>` alias (default kTesterAliasIp4Be) —
# §4.6.5.5 UDP_USER_INTERFACE_08 directs the DUT to emit to this
# address, the host must answer ARP for it, and the ut-ping preflight
# sources from it (see lwip_fixture_wait_dut_ready). The single-pc
# topology gets the same alias from setup-netns.sh. The DUT-side alias
# (UI_07, 172.16.0.5) needs no interface config: the lwIP UT emits it
# via udp_sendto_if_src.
LWIP_TESTER_ALIAS_IP=172.16.0.4

ip tuntap add dev "$LWIP_TAP" mode tap
ip addr add 172.16.0.1/24 dev "$LWIP_TAP"
ip addr add "$LWIP_TESTER_ALIAS_IP/24" dev "$LWIP_TAP"
# Host-2 emulation (kUdpHost2IpBe) — §4.6.5.4 UDP_FIELDS_04 directs the
# DUT to emit to a second host on the link, so its ARP query for
# 172.16.0.3 must get an answer. The single-pc topology solves this
# with a NUD_PERMANENT neigh pin inside the DUT netns; an external DUT's
# ARP cache is not reachable from the harness, so the fixture answers
# from the tap instead. /32 scope: host-local answerability only, no
# second routable subnet.
ip addr add 172.16.0.3/32 dev "$LWIP_TAP"
ip link set "$LWIP_TAP" up

# Stimulus-suppression iptables leaks from killed prior runs need no
# fixture-side handling: the harness RAIIs install every rule inside
# the dedicated `tc8-stimulus` chain and smoke-test.sh flushes that
# chain at worker bring-up (shape-agnostic, all topologies).

lwip_fixture_spawn_dut() {
    # {LWIP_LOCK_FD}>&-: the DUT must not inherit the fixture lock fd —
    # a DUT surviving a crashed smoke-test.sh would hold the lock and
    # deadlock the next run before its bring-up pkill could reap it.
    setsid env \
        PRECONFIGURED_TAPIF="$LWIP_TAP" \
        TC8_LWIP_DUT_IP="$LWIP_DUT_IP" \
        TC8_LWIP_DUT_MASK=255.255.255.0 \
        TC8_LWIP_DUT_GW=172.16.0.1 \
        "$LWIP_APP" >>"$LWIP_FIX_DIR/dut.log" 2>&1 </dev/null \
        {LWIP_LOCK_FD}>&- &
    disown
}

# Readiness probe instead of a fixed boot sleep: an OpPing round trip
# proves the tap link, the lwIP netif, and the UT server bind + thread
# end to end. The DUT's "stack up" stderr line is NOT a sufficient
# signal — StartUpperTesterServer() returns before the detached server
# thread has bound UDP 30600, so the line can precede UT readiness.
# Worst case ~7.5 s (25 x 200 ms reply timeout + 0.1 s tick); the happy
# path converges in well under a second because an unbound UT port
# answers with ICMP port-unreachable and ut-ping fails fast.
#
# --source-ip pins the probe to the tester ALIAS, NOT the primary
# tester IP: the DUT answers the probe by ARP-resolving the
# probe's source, and this fixture has no way to flush the lwIP ARP
# table afterwards (per-case neigh conditioning is a Linux-netns
# affordance). Probing from the primary IP would hand every freshly
# respawned DUT a warm <172.16.0.1> entry and silently break the §4.2
# cold-cache cases (ARP_07.., "DUT must emit its own ARP Request")
# whose premise is that exact entry's absence. The alias entry the
# probe does warm (<172.16.0.4>) is harmless — no §4.2 assertion
# references it.
lwip_fixture_wait_dut_ready() {
    local attempt
    for attempt in $(seq 25); do
        if "$HARNESS" ut-ping --dut-ip "$LWIP_DUT_IP" --timeout 200 \
               --source-ip "$LWIP_TESTER_ALIAS_IP" \
               >/dev/null 2>&1; then
            return 0
        fi
        sleep 0.1
    done
    echo "lwip-tap-fixture: DUT did not answer OpPing after spawn (see $LWIP_FIX_DIR/dut.log)" >&2
    return 1
}

lwip_fixture_socket_snapshot() {
    # Tester sockets toward the DUT still mid-close from the tester's
    # side (`ss state connected` covers everything but LISTEN and
    # CLOSED). TIME-WAIT and FIN-WAIT-2 are excluded: in both the
    # tester's FIN is already out (and ACKed), so nothing more drains
    # from this side — FIN-WAIT-2 halves are freed by the DUT's
    # SIGTERM slot abort in lwip_fixture_kill_dut below. One
    # "local peer" quad per line, sorted for comm(1).
    ss -H -tn state connected dst "$LWIP_DUT_IP" 2>/dev/null \
        | { grep -vE 'TIME-WAIT|FIN-WAIT-2' || true; } \
        | awk '{print $(NF-1), $NF}' | sort
}

# Pre-existing (frozen) sockets toward the DUT IP are not this run's
# to drain — snapshot them once so the per-case drain only waits on
# sockets the current run created.
LWIP_BASELINE_SOCKS=$(lwip_fixture_socket_snapshot)

lwip_fixture_spawn_dut
lwip_fixture_wait_dut_ready || exit 1

TC8_TOPOLOGY_IFACE=$LWIP_TAP
TC8_TOPOLOGY_DUT_IP=$LWIP_DUT_IP
# Source every external.conf preflight probe (ICMP reachability +
# ut-ping) from the tester alias for the same cold-cache reason as
# lwip_fixture_wait_dut_ready below: position-1 §4.2 cases run on the
# bring-up DUT, and a primary-IP-sourced probe would hand it a warm
# <172.16.0.1> ARP entry no later flush can remove.
TC8_TOPOLOGY_PREFLIGHT_SRC_IP=$LWIP_TESTER_ALIAS_IP
TC8_TOPOLOGY_TESTER_IP=172.16.0.1

# Per-case DUT respawn: run_case calls topology_stop_dut unconditionally
# at case teardown. Case stimuli hardcode the UT socket ids a freshly
# spawned DUT hands out (1, 2, ...), and passing cases legitimately
# leave auxiliary sockets open — on a truly persistent DUT the leaked
# slots shift every later case's id sequence (proven by the TCP sweep:
# OpOpenTcpSocket answered sid=3, every follow-up op on the hardcoded
# id 1 collapsed to kStatusUnknownSocket). Respawning here restores the
# per-case fresh-DUT semantics the Linux fixture gets from
# TOPOLOGY_SUPPORTS_DUT_SPAWN=1; the stack re-attaches to the
# persistent tap and keeps the same MAC, so the host-side neigh entry
# the preflight ping populated stays valid.
# Drain BEFORE killing the DUT: the harness was just reaped and its
# tester-side sockets are closing; against a still-live lwIP their
# FINs complete normal exchanges (ACK / RST for unknown pcbs) and
# the sockets reach CLOSED / reopenable TIME-WAIT. Killing the DUT
# first turns every one of them into an orphaned FIN-WAIT-1 /
# LAST-ACK retransmitting into the void; once the next teardown
# also removes the tap those orphans freeze with dead timers and
# answer the NEXT run's SYN on the same port quad with a stale
# challenge-ACK (observed: TCP_CLOSING_07 alternating pass/fail).
# `ss -K` is NOT a substitute — SOCK_DESTROY silently no-ops on
# this host (rc 0, socket survives), so the fixture prevents the
# orphans instead of trying to destroy them after the fact.
# Drained = no socket beyond the bring-up baseline snapshot still
# mid-close toward the DUT. The baseline subtraction matters: this
# development host carries ~11 permanently frozen FIN-WAIT-1 orphans
# toward the DUT IP from runs whose tap was deleted mid-close (dead
# retransmit timers, SOCK_DESTROY no-ops, they never drain) — counting
# them would make every poll time out. Polled instead of a fixed
# sleep: 0.1 s tick, 2 s budget, loud warning on timeout because
# killing the DUT then risks exactly the stale-challenge-ACK failure
# mode above.
lwip_fixture_drain_tester_sockets() {
    local attempt residual=0
    for attempt in $(seq 20); do
        residual=$(comm -23 <(lwip_fixture_socket_snapshot) \
                            <(printf '%s\n' "$LWIP_BASELINE_SOCKS") \
                       | grep -c . || true)
        if [[ "$residual" -eq 0 ]]; then
            return 0
        fi
        sleep 0.1
    done
    echo "lwip-tap-fixture: WARNING — $residual tester socket(s) toward $LWIP_DUT_IP still mid-close after 2 s drain; the respawn below may orphan them (stale challenge-ACK risk on port-quad reuse)" >&2
}

# SIGTERM first, SIGKILL backstop: on TERM the DUT aborts every open
# UT slot (RST on the wire) before exiting, so tester-side halves of
# case-leaked connections reach CLOSED instead of orphaning in
# FIN-WAIT-2 — a userspace stack emits nothing on SIGKILL, unlike the
# Linux DUT whose kernel closes sockets on process death, and a
# FIN-WAIT-2 orphan swallows the next case's SYN when the respawned
# stack reuses the same deterministic port quad (observed:
# TCP_FLAGS_INVALID_09/_12/_13 phase-1 timeouts in the first
# single-invocation full sweep).
lwip_fixture_kill_dut() {
    pkill -TERM -f "tc8-lwip-dut" 2>/dev/null || true
    local attempt
    for attempt in $(seq 10); do
        pgrep -f "tc8-lwip-dut" >/dev/null 2>&1 || return 0
        sleep 0.05
    done
    # Loud, not silent: SIGKILL here means the slot abort did not
    # finish, so the FIN-WAIT-2 orphan risk this teardown exists to
    # prevent is back for this boundary — a later same-quad SYN
    # timeout should be read against this line.
    echo "lwip-tap-fixture: WARNING — DUT ignored SIGTERM for 0.5 s, falling back to SIGKILL (UT slot abort incomplete; FIN-WAIT-2 orphan risk on reused quads)" >&2
    pkill -KILL -f "tc8-lwip-dut" 2>/dev/null || true
}

topology_stop_dut() {
    lwip_fixture_drain_tester_sockets
    lwip_fixture_kill_dut
    lwip_fixture_spawn_dut
    # Respawn-probe failure is a warning, not an abort: run_case calls
    # this hook as a plain statement under `set -e`, and the established
    # fixture policy is "the next case fails visibly" rather than
    # killing the whole worker from a teardown path.
    lwip_fixture_wait_dut_ready || true
}

# Fixture teardown rides the profile hook — conf files are sourced after
# the profile, so overriding hooks is supported.
topology_tear_down_worker() {
    lwip_fixture_kill_dut
    ip link del "$LWIP_TAP" 2>/dev/null || true
    # Preserve the DUT log for postmortems; the run dir itself goes away.
    mv "$LWIP_FIX_DIR/dut.log" /tmp/tc8-lwipfix-last-dut.log 2>/dev/null || true
    rm -rf "$LWIP_FIX_DIR"
}
