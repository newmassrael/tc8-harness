# Self-contained verification fixture for the 'ssh-remote' topology.
# Run:
#   sudo dut/env/smoke-test.sh --topology ssh-remote \
#        --topology-conf dut/env/topology.d/examples/ssh-remote-netns-fixture.conf \
#        SOMEIPSRV_FORMAT_01 ICMPv4_TYPE_08
# Expected: PASS + PASS — FORMAT_01 proves per-case fresh DUT spawn and
# harness-first start order work over the SSH path.
#
# Verification fixture for the 'ssh-remote' topology profile.
# Emulates a second PC: an isolated netns holding the DUT-side veth AND
# a dedicated sshd (port 2222, fixture-local keys — the user's ~/.ssh is
# untouched). The ssh-remote profile then drives it exactly as it would
# a real remote host. Sourced as root by smoke-test.sh.
FIX_NS=tc8-sshfix-dut
FIX_DIR=/tmp/tc8-sshfix

TC8_TOPOLOGY_SSH_TARGET=root@172.16.0.2
TC8_TOPOLOGY_SSH_OPTS="-p 2222 -i $FIX_DIR/client -o StrictHostKeyChecking=no -o UserKnownHostsFile=$FIX_DIR/known_hosts"
TC8_TOPOLOGY_REMOTE_DUT_BIN=$ROOT/build/dut/dut_service/tc8-dut
TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG=$VSOMEIP_CFG
TC8_TOPOLOGY_REMOTE_CAPI_CFG=$CAPI_CFG
TC8_TOPOLOGY_IFACE=veth-sshfix-t
TC8_TOPOLOGY_DUT_IP=172.16.0.2
TC8_TOPOLOGY_TESTER_IP=172.16.0.1

# Stand up the emulated remote host in the run-level hook — NOT at source time: a
# sourced .conf should declare config + define hooks, never execute host setup as a
# side effect of being read (sourcing this for `--print-expect` must stay clean +
# unprivileged). Brings up the netns + veth + SD multicast route + a fixture-local
# sshd, settles, then verifies via the profile's shared helper (SSOT — the same
# SSH/remote/ICMP/spawn-probe gate the real-host provision_run runs).
topology_provision_run() {
    [ -f "$FIX_DIR/sshd.pid" ] && kill -KILL "$(cat "$FIX_DIR/sshd.pid")" 2>/dev/null || true
    pkill -KILL -x tc8-dut 2>/dev/null || true
    ip netns del "$FIX_NS" 2>/dev/null || true
    ip link del veth-sshfix-t 2>/dev/null || true
    rm -rf "$FIX_DIR"
    mkdir -p "$FIX_DIR"
    ssh-keygen -q -t ed25519 -N '' -f "$FIX_DIR/hostkey"
    ssh-keygen -q -t ed25519 -N '' -f "$FIX_DIR/client"
    ip netns add "$FIX_NS"
    ip link add veth-sshfix-t type veth peer name veth-sshfix-d
    ip link set veth-sshfix-d netns "$FIX_NS"
    ip addr add 172.16.0.1/24 dev veth-sshfix-t
    ip link set veth-sshfix-t up
    ip netns exec "$FIX_NS" ip addr add 172.16.0.2/24 dev veth-sshfix-d
    ip netns exec "$FIX_NS" ip link set veth-sshfix-d up
    ip netns exec "$FIX_NS" ip link set lo up
    # Multicast route for SOME/IP-SD (mirrors setup-netns.sh): tester side
    # in the root ns, DUT side inside the fixture ns.
    ip route add 224.0.0.0/4 dev veth-sshfix-t 2>/dev/null || true
    ip netns exec "$FIX_NS" ip route add 224.0.0.0/4 dev veth-sshfix-d
    mkdir -p /run/sshd
    ip netns exec "$FIX_NS" /usr/sbin/sshd \
        -o Port=2222 -o ListenAddress=172.16.0.2 \
        -o HostKey="$FIX_DIR/hostkey" \
        -o AuthorizedKeysFile="$FIX_DIR/client.pub" \
        -o PermitRootLogin=prohibit-password \
        -o StrictModes=no \
        -o PidFile="$FIX_DIR/sshd.pid"
    sleep 0.5   # sshd listen settle before the SSH liveness probe
    _sshremote_verify_dut_live
}

# Reap the emulated remote host this overlay owns (the profile's teardown_run only
# last-resort-reaps tc8-dut; the netns + sshd + scratch are the fixture's).
topology_teardown_run() {
    ssh -o BatchMode=yes -p 2222 -i /tmp/tc8-sshfix/client \
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/tc8-sshfix/known_hosts \
        root@172.16.0.2 "pkill -KILL -x tc8-dut" 2>/dev/null || true
    [ -f /tmp/tc8-sshfix/sshd.pid ] && kill -KILL "$(cat /tmp/tc8-sshfix/sshd.pid)" 2>/dev/null || true
    ip route del 224.0.0.0/4 dev veth-sshfix-t 2>/dev/null || true
    ip netns del tc8-sshfix-dut 2>/dev/null || true
    ip link del veth-sshfix-t 2>/dev/null || true
    rm -rf /tmp/tc8-sshfix /tmp/tc8-remote-vsomeip-*
}
