# Topology profile: single-pc
#
# Tester and the reference tc8-dut run as per-worker Linux netns pairs on
# this host (tc8-tester-$W / tc8-dut-$W bridged by veth-tester-$W /
# veth-dut-$W). This is the historical smoke-test.sh behaviour and the CI
# default — full parallel workers, per-case DUT kernel conditioning, and
# --negative self-validation are all available.
#
# Sourced by smoke-test.sh; see the "Topology profile contract" comment
# there for the full hook list. Every hook logs its own failures — a
# profile function must never fail silently.

TOPOLOGY_DESCRIPTION="tester + reference tc8-dut in per-worker netns pairs on this host"
# The DUT is a freshly-spawned Linux network stack we own: per-case
# sysctl/neigh conditioning (ARP_38 arp_accept, ARP_48/49 neigh timers,
# TCP RTO toggles, ...) is possible and required for those cases.
TOPOLOGY_DUT_CONDITIONING=1
# --negative deliberately mis-expects values against the spawned DUT and
# relies on --dut-first start-order tricks — only meaningful here.
TOPOLOGY_SUPPORTS_NEGATIVE=1
# smoke-test starts/stops one tc8-dut per case (fresh DUT, no cross-case
# state).
TOPOLOGY_SUPPORTS_DUT_SPAWN=1
# netns pairs are cheap — no worker cap beyond the CLI value.
TOPOLOGY_MAX_WORKERS=""

topology_preflight() {
    [[ -x "$TC8_DUT_BIN" ]] \
        || { echo "smoke-test[single-pc]: preflight FAIL — tc8-dut binary missing or not executable: $TC8_DUT_BIN" >&2; return 1; }
    [[ -f "$VSOMEIP_CFG" ]] \
        || { echo "smoke-test[single-pc]: preflight FAIL — vsomeip.json missing: $VSOMEIP_CFG" >&2; return 1; }
    command -v ip >/dev/null \
        || { echo "smoke-test[single-pc]: preflight FAIL — 'ip' (iproute2) not found" >&2; return 1; }
    [[ -x "$HERE/setup-netns.sh" ]] \
        || { echo "smoke-test[single-pc]: preflight FAIL — setup-netns.sh missing: $HERE/setup-netns.sh" >&2; return 1; }
    echo "smoke-test[single-pc]: preflight OK — tc8-dut=$TC8_DUT_BIN, vsomeip cfg=$VSOMEIP_CFG"
    return 0
}

# Bring up a single worker's netns pair and record its DUT-side MAC.
# The common sentinel/junit/log scaffolding under $WORK_ROOT/$W is
# created by smoke-test.sh's common_bring_up_worker before this hook.
topology_bring_up_worker() {
    local W=$1
    # VLAN_ID is forwarded verbatim (empty = off, the default). When an OEM
    # profile sets it, setup-netns.sh homes L3 on a VLAN subinterface so the
    # tester<->DUT path is 802.1Q-tagged. TC8's own cases are never tagged,
    # so the in-tree smoke suite always runs with VLAN_ID unset.
    env TESTER_NS="tc8-tester-$W" DUT_NS="tc8-dut-$W" \
        VETH_T="veth-tester-$W" VETH_D="veth-dut-$W" \
        TESTER_IP="${TESTER_IP4}/24" DUT_IP="${DUT_IP4}/24" \
        SECOND_VETH="$NEED_SECOND_VETH" \
        VETH_T2="veth-tester2-$W" VETH_D2="veth-dut2-$W" \
        TESTER_IP2="${TESTER_IP4_2}/24" DUT_IP2="${DUT_IP4_2}/24" \
        VLAN_ID="${VLAN_ID:-}" \
        "$HERE/setup-netns.sh" >/dev/null

    # Per-worker tc8-dut symlink: worker-unique argv[0] so
    # kill_worker_procs pkills are scoped to this worker only (the
    # tc8-harness symlink is created by common_bring_up_worker — every
    # topology runs the harness locally).
    ln -sf "$TC8_DUT_BIN" "$VSOMEIP_BASE/$W/tc8-dut"

    # veth MAC is kernel-assigned per `ip link add` invocation. Capture
    # AFTER setup-netns.sh completes; feed it to ARP_13 expectations for
    # every case this worker runs.
    local mac
    mac=$(ip -n "tc8-dut-$W" link show "veth-dut-$W" \
        | awk '/link\/ether/ { print $2 }')
    [[ -n "$mac" ]] \
        || { echo "smoke-test[single-pc]: failed to read veth-dut-$W MAC" >&2; exit 1; }
    echo "$mac" >"$WORK_ROOT/$W/dut_mac"

    # Symmetric capture for the tester-side veth — needed by §4.5
    # IPv4_AUTOCONF_ADDRESS_SELECTION cases that pin
    # <tester_ip, tester_mac> NUD_PERMANENT on the DUT side to
    # suppress the kernel's UT-Confirmation-driven ARP resolve
    # (see tester_neigh_pin block in run_case).
    local tester_mac
    tester_mac=$(ip -n "tc8-tester-$W" link show "veth-tester-$W" \
        | awk '/link\/ether/ { print $2 }')
    [[ -n "$tester_mac" ]] \
        || { echo "smoke-test[single-pc]: failed to read veth-tester-$W MAC" >&2; exit 1; }
    echo "$tester_mac" >"$WORK_ROOT/$W/tester_mac"

    # Pin the DUT neighbor entry on the tester side as NUD_PERMANENT. The
    # setup-netns.sh reachability ping populates it in NUD_STALE/REACHABLE,
    # but under a long full-suite run (>gc_stale_time) the entry can age
    # out or go through a transitional state that triggers tester-kernel
    # ARP resolution. When the tester kernel broadcasts its own Request,
    # the DUT receives it and learns <tester_ip, real_tester_MAC> via
    # RFC 826 §2.3 reception — which is exactly what Group C ARP_22/28/38
    # pass-criterion ("DUT emits its own ARP Request on cold cache") does
    # NOT want. Pinning the entry as PERMANENT guarantees tester never
    # ARPs for DUT, DUT's cache stays cold until its own egress need, and
    # the pass-guard fires deterministically.
    #
    # Phase 2 (ARP_03..06) is unaffected: those cases verify the DUT-side
    # cache entry learned from a raw tester-injected frame, which sits
    # independently of the tester-side neigh table pinned here.
    ip -n "tc8-tester-$W" neigh replace "$DUT_IP4" \
        lladdr "$mac" nud permanent dev "veth-tester-$W"

    # §4.6.5.4 UDP_FIELDS_04/_05 Topology 2 second-host pin: pin
    # `<172.16.0.3, tester_mac>` on the DUT side as NUD_PERMANENT so the
    # DUT's egress ARP for Host-2-IP resolves to the tester's MAC
    # without a real responder. 172.16.0.3 is intentionally NOT
    # configured as a tester-side alias — Linux's IP layer with
    # ip_forward=0 silently drops the unmatched inbound, while pcap on
    # AF_PACKET ETH_P_ALL still observes the wire frame for the SCXML
    # `udp_observed` event. The pin is unconditional (sticky for the
    # whole worker lifetime); other cases that don't address 172.16.0.3
    # are unaffected. Single-homed in wire.def `HOST2_IP` (sourced as
    # $TC8_WIRE_HOST2_IP), cross-checked against `kUdpHost2IpBe` in
    # `src/sce_integration/udp_pilot_common.h`.
    ip -n "tc8-dut-$W" neigh replace "$TC8_WIRE_HOST2_IP" \
        lladdr "$tester_mac" nud permanent dev "veth-dut-$W"
}

topology_tear_down_worker() {
    local W=$1
    # Reap any tc8-dut still running under this worker's symlink path
    # (belt-and-suspenders — run_case/run_negative_case already call
    # topology_stop_dut per case). The harness side is reaped by the
    # common teardown in smoke-test.sh.
    kill_worker_procs "$VSOMEIP_BASE/$W/tc8-dut"
    env TESTER_NS="tc8-tester-$W" DUT_NS="tc8-dut-$W" \
        "$HERE/cleanup.sh" >/dev/null 2>&1 || true
}

topology_tester_iface() {
    # Deliberately the BASE veth even under a VLAN profile: capturing on the
    # bare veth delivers frames with the 802.1Q tag intact (libpcap on the
    # subinterface would see the kernel strip it), which is what lets the
    # harness OBSERVE the tag. Kernel-socket stimulus and the DUT egress are
    # tagged regardless because their L3 address lives on the subinterface.
    echo "veth-tester-$1"
}

# Run a foreground command in the tester network context.
topology_exec_tester() {
    local W=$1
    shift
    ip netns exec "tc8-tester-$W" "$@"
}

topology_tester_iface_secondary() {
    # Available only when the case list requested the Topology 2 second
    # veth pair at bring-up (NEED_SECOND_VETH); empty otherwise.
    if [[ "$NEED_SECOND_VETH" == "1" ]]; then
        echo "veth-tester2-$1"
    fi
}

# Start the harness in the tester netns, backgrounded; echoes its PID.
# Args: W hlog harness-args...
topology_run_harness() {
    local W=$1 hlog=$2
    shift 2
    ip netns exec "tc8-tester-$W" "$VSOMEIP_BASE/$W/tc8-harness" \
        "$@" >"$hlog" 2>&1 &
    echo $!
}

# Start one fresh tc8-dut in the DUT netns, backgrounded; echoes its PID.
# Args: W dlog vsomeip_cfg [extra env KEY=VALUE...]
topology_start_dut() {
    local W=$1 dlog=$2 cfg=$3
    shift 3
    ip netns exec "tc8-dut-$W" env \
        COMMONAPI_CONFIG="$CAPI_CFG" \
        VSOMEIP_CONFIGURATION="$cfg" \
        VSOMEIP_APPLICATION_NAME=tc8-dut \
        VSOMEIP_BASE_PATH="$VSOMEIP_BASE/$W/" \
        "$@" \
        "$VSOMEIP_BASE/$W/tc8-dut" >"$dlog" 2>&1 &
    echo $!
}

topology_stop_dut() {
    kill_worker_procs "$VSOMEIP_BASE/$1/tc8-dut"
}
