# Topology profile: external
#
# The DUT is a physically separate, already-running device (real target
# ECU, second PC, or any DUT firmware implementing the spec) reachable
# through a local network interface. smoke-test does NOT start, stop, or
# condition the DUT — it only drives the tester side and verifies the
# wire.
#
# Configuration (via --topology-conf FILE containing the assignments, or
# environment when not running through sudo's env_reset):
#   TC8_TOPOLOGY_IFACE            tester capture/injection NIC (required)
#   TC8_TOPOLOGY_DUT_IP           DUT IPv4 address  (required)
#   TC8_TOPOLOGY_TESTER_IP        tester IPv4 address (required)
#   TC8_TOPOLOGY_DUT_MAC          DUT MAC; resolved via ICMP ping + neigh
#                                 table when unset
#   TC8_TOPOLOGY_IFACE_SECONDARY  optional second NIC for TC8 Topology 2
#                                 cases (DHCPv4_CLIENT_USAGE_01)
#   TC8_TOPOLOGY_DUT_ALIAS_IP     optional DUT alias for UDP_USER_INTERFACE_07/08
#   TC8_TOPOLOGY_TESTER_ALIAS_IP  optional tester alias for the same cases

TOPOLOGY_DESCRIPTION="persistent external DUT (target ECU / second PC) on a local NIC"
# The DUT's network stack is not ours: per-case sysctl/neigh
# conditioning is impossible. Affected cases run anyway with an INFO
# line explaining the omission (see log_conditioning_skip).
TOPOLOGY_DUT_CONDITIONING=0
# --negative needs a spawned reference DUT + start-order tricks.
TOPOLOGY_SUPPORTS_NEGATIVE=0
# The DUT is persistent — smoke-test never starts or stops it.
TOPOLOGY_SUPPORTS_DUT_SPAWN=0
# One physical DUT cannot serve parallel workers.
TOPOLOGY_MAX_WORKERS=1

topology_preflight() {
    local fail=0
    for v in TC8_TOPOLOGY_IFACE TC8_TOPOLOGY_DUT_IP TC8_TOPOLOGY_TESTER_IP; do
        if [[ -z "${!v:-}" ]]; then
            echo "smoke-test[external]: preflight FAIL — $v is not set (pass a --topology-conf file; sudo strips environment variables)" >&2
            fail=1
        fi
    done
    [[ $fail -eq 0 ]] || return 1

    local iface=$TC8_TOPOLOGY_IFACE
    if [[ ! -d "/sys/class/net/$iface" ]]; then
        echo "smoke-test[external]: preflight FAIL — interface '$iface' does not exist on this host" >&2
        return 1
    fi
    echo "smoke-test[external]: preflight: interface '$iface' exists — OK"

    local operstate
    operstate=$(cat "/sys/class/net/$iface/operstate" 2>/dev/null || echo unreadable)
    case "$operstate" in
        up|unknown)
            echo "smoke-test[external]: preflight: interface '$iface' operstate=$operstate — OK"
            ;;
        *)
            echo "smoke-test[external]: preflight FAIL — interface '$iface' operstate=$operstate (link down or not configured)" >&2
            return 1
            ;;
    esac

    if [[ -n "${TC8_TOPOLOGY_IFACE_SECONDARY:-}" ]] \
        && [[ ! -d "/sys/class/net/$TC8_TOPOLOGY_IFACE_SECONDARY" ]]; then
        echo "smoke-test[external]: preflight FAIL — secondary interface '$TC8_TOPOLOGY_IFACE_SECONDARY' does not exist" >&2
        return 1
    fi

    # Tester identity sanity: stimulus frames are raw-injected with
    # TC8_TOPOLOGY_TESTER_IP as the source; if the host interface does
    # not actually carry that address, kernel-socket paths (Upper
    # Tester UDP) will source a different IP and identity-keyed
    # expectations can mismatch. Warn loudly, do not block — split-
    # identity setups can be deliberate.
    if ! ip -4 addr show dev "$iface" | grep -q "inet ${TC8_TOPOLOGY_TESTER_IP}/"; then
        echo "smoke-test[external]: preflight WARNING — '$iface' does not carry tester IP $TC8_TOPOLOGY_TESTER_IP; kernel-socket traffic (Upper Tester) will use a different source address than raw-injected stimulus" >&2
    else
        echo "smoke-test[external]: preflight: tester IP $TC8_TOPOLOGY_TESTER_IP present on '$iface' — OK"
    fi

    # DUT reachability: ICMP Echo (the DUT must answer per TC8 §4.3).
    if ping -c1 -W2 -I "$iface" "$TC8_TOPOLOGY_DUT_IP" >/dev/null 2>&1; then
        echo "smoke-test[external]: preflight: DUT $TC8_TOPOLOGY_DUT_IP answers ICMP Echo — OK"
    else
        echo "smoke-test[external]: preflight FAIL — DUT $TC8_TOPOLOGY_DUT_IP did not answer ICMP Echo on '$iface' (DUT down, cable, or IP mismatch)" >&2
        return 1
    fi

    # Upper Tester probe — side-effect-free OpPing round trip (UT UDP
    # port 30600). A UT-less DUT is legitimate for observation-only
    # cases, so failure is a WARNING by default; set
    # TC8_TOPOLOGY_REQUIRE_UT=1 to promote it to a preflight FAIL when
    # the planned case list depends on UT.
    if "$HARNESS" ut-ping --dut-ip "$TC8_TOPOLOGY_DUT_IP"; then
        echo "smoke-test[external]: preflight: Upper Tester probe — OK"
    elif [[ "${TC8_TOPOLOGY_REQUIRE_UT:-0}" == "1" ]]; then
        echo "smoke-test[external]: preflight FAIL — Upper Tester did not answer (UDP port 30600) and TC8_TOPOLOGY_REQUIRE_UT=1" >&2
        return 1
    else
        echo "smoke-test[external]: preflight WARNING — Upper Tester did not answer (UDP port 30600); UT-dependent cases will fail visibly. Set TC8_TOPOLOGY_REQUIRE_UT=1 to make this fatal." >&2
    fi
    return 0
}

topology_bring_up_worker() {
    local W=$1
    local iface=$TC8_TOPOLOGY_IFACE

    # DUT MAC: operator-pinned, or resolved from the neigh table the
    # preflight ping populated.
    local mac=${TC8_TOPOLOGY_DUT_MAC:-}
    if [[ -z "$mac" ]]; then
        mac=$(ip -4 neigh show "$TC8_TOPOLOGY_DUT_IP" dev "$iface" 2>/dev/null \
            | awk '/lladdr/ { print $3; exit }')
        if [[ -z "$mac" ]]; then
            echo "smoke-test[external]: failed to resolve the DUT MAC for $TC8_TOPOLOGY_DUT_IP on '$iface' — set TC8_TOPOLOGY_DUT_MAC explicitly" >&2
            exit 1
        fi
        echo "smoke-test[external]: DUT MAC resolved from neigh table: $mac"
    else
        echo "smoke-test[external]: DUT MAC pinned by operator: $mac"
    fi
    echo "$mac" >"$WORK_ROOT/$W/dut_mac"

    cat "/sys/class/net/$iface/address" >"$WORK_ROOT/$W/tester_mac"
}

topology_tear_down_worker() {
    # Nothing to tear down — the DUT and the NIC belong to the operator.
    :
}

topology_tester_iface() {
    echo "$TC8_TOPOLOGY_IFACE"
}

topology_tester_iface_secondary() {
    echo "${TC8_TOPOLOGY_IFACE_SECONDARY:-}"
}

# The tester context is simply this host.
topology_exec_tester() {
    shift
    "$@"
}

topology_run_harness() {
    local W=$1 hlog=$2
    shift 2
    "$VSOMEIP_BASE/$W/tc8-harness" "$@" >"$hlog" 2>&1 &
    echo $!
}

# Contract stubs: never invoked on the SUPPORTS_DUT_SPAWN=0 path, but a
# future caller must get a loud message, not a silent no-op.
topology_start_dut() {
    echo "smoke-test[external]: BUG — topology_start_dut called although TOPOLOGY_SUPPORTS_DUT_SPAWN=0" >&2
    return 1
}

topology_stop_dut() {
    # Called unconditionally from run_case teardown; the external DUT is
    # persistent, so there is deliberately nothing to stop.
    :
}
