# Topology profile: ssh-remote
#
# PC-to-PC: the tester runs here; the reference tc8-dut runs on a second
# Linux host reachable over SSH. smoke-test starts one fresh tc8-dut per
# case on the remote host (same fresh-DUT-per-case semantics as
# single-pc) but cannot condition the remote kernel — affected cases run
# with a logged INFO omission, exactly like the external profile.
#
# Configuration (via --topology-conf FILE; sudo strips environment):
#   TC8_TOPOLOGY_SSH_TARGET         user@host for the DUT machine (required)
#   TC8_TOPOLOGY_SSH_OPTS           extra ssh options, word-split (e.g.
#                                   "-p 2222 -i /path/key"); optional
#   TC8_TOPOLOGY_REMOTE_DUT_BIN     tc8-dut path on the remote host (required)
#   TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG vsomeip.json path on the remote host
#                                   (required); per-case flavor configs are
#                                   resolved as sibling files by basename,
#                                   so the remote directory must carry the
#                                   same vsomeip-*.json set as dut/dut_service/
#   TC8_TOPOLOGY_REMOTE_CAPI_CFG    commonapi.ini path on the remote host
#                                   (required)
#   TC8_TOPOLOGY_REMOTE_WRAP        optional command prefix on the remote
#                                   side (lab fixtures, taskset, ...)
#   TC8_TOPOLOGY_IFACE              tester NIC facing the DUT host (required)
#   TC8_TOPOLOGY_DUT_IP             DUT IPv4 on the wire (required)
#   TC8_TOPOLOGY_TESTER_IP          tester IPv4 on the wire (required)
#   TC8_TOPOLOGY_DUT_MAC            DUT MAC; neigh-resolved when unset
#   TC8_TOPOLOGY_IFACE_SECONDARY    optional second NIC (TC8 Topology 2)

TOPOLOGY_DESCRIPTION="tester on this PC, reference tc8-dut spawned per case on a second PC over SSH"
# The remote kernel is another machine's: per-case sysctl/neigh
# conditioning is deliberately not attempted (it would mutate a shared
# host's global state). Affected cases log the omission and run.
TOPOLOGY_DUT_CONDITIONING=0
# --negative relies on netns-local symlink/start-order tricks.
TOPOLOGY_SUPPORTS_NEGATIVE=0
# One fresh remote tc8-dut per case, via ssh.
TOPOLOGY_SUPPORTS_DUT_SPAWN=1
# One remote DUT host serves one worker.
TOPOLOGY_MAX_WORKERS=1

# Word-split is intentional for the option string. -n keeps ssh away
# from the caller's stdin: run_case executes inside worker_main's
# while-read loop, and an stdin-inheriting ssh slurps the remaining
# work bucket — cases silently vanish from the run.
_ssh_dut() {
    # shellcheck disable=SC2086
    ssh -n -o BatchMode=yes -o ConnectTimeout=5 ${TC8_TOPOLOGY_SSH_OPTS:-} \
        "$TC8_TOPOLOGY_SSH_TARGET" "$@"
}

topology_preflight() {
    local fail=0
    for v in TC8_TOPOLOGY_SSH_TARGET TC8_TOPOLOGY_REMOTE_DUT_BIN \
             TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG TC8_TOPOLOGY_REMOTE_CAPI_CFG \
             TC8_TOPOLOGY_IFACE TC8_TOPOLOGY_DUT_IP TC8_TOPOLOGY_TESTER_IP; do
        if [[ -z "${!v:-}" ]]; then
            echo "smoke-test[ssh-remote]: preflight FAIL — $v is not set (pass a --topology-conf file; sudo strips environment variables)" >&2
            fail=1
        fi
    done
    [[ $fail -eq 0 ]] || return 1

    if [[ ! -d "/sys/class/net/$TC8_TOPOLOGY_IFACE" ]]; then
        echo "smoke-test[ssh-remote]: preflight FAIL — interface '$TC8_TOPOLOGY_IFACE' does not exist on this host" >&2
        return 1
    fi
    echo "smoke-test[ssh-remote]: preflight: interface '$TC8_TOPOLOGY_IFACE' exists — OK"

    if ! _ssh_dut true; then
        echo "smoke-test[ssh-remote]: preflight FAIL — cannot SSH to '$TC8_TOPOLOGY_SSH_TARGET' non-interactively (key auth + BatchMode required)" >&2
        return 1
    fi
    echo "smoke-test[ssh-remote]: preflight: SSH to '$TC8_TOPOLOGY_SSH_TARGET' — OK"

    if ! _ssh_dut "test -x '$TC8_TOPOLOGY_REMOTE_DUT_BIN'"; then
        echo "smoke-test[ssh-remote]: preflight FAIL — remote tc8-dut missing or not executable: $TC8_TOPOLOGY_REMOTE_DUT_BIN" >&2
        return 1
    fi
    if ! _ssh_dut "test -f '$TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG' && test -f '$TC8_TOPOLOGY_REMOTE_CAPI_CFG'"; then
        echo "smoke-test[ssh-remote]: preflight FAIL — remote vsomeip/commonapi config missing: $TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG / $TC8_TOPOLOGY_REMOTE_CAPI_CFG" >&2
        return 1
    fi
    echo "smoke-test[ssh-remote]: preflight: remote tc8-dut + configs present — OK"

    if ping -c1 -W2 -I "$TC8_TOPOLOGY_IFACE" "$TC8_TOPOLOGY_DUT_IP" >/dev/null 2>&1; then
        echo "smoke-test[ssh-remote]: preflight: DUT host $TC8_TOPOLOGY_DUT_IP answers ICMP Echo — OK"
    else
        echo "smoke-test[ssh-remote]: preflight FAIL — DUT host $TC8_TOPOLOGY_DUT_IP did not answer ICMP Echo on '$TC8_TOPOLOGY_IFACE'" >&2
        return 1
    fi

    echo "smoke-test[ssh-remote]: preflight: Upper Tester not probed (no side-effect-free UT opcode); UT-dependent cases will fail visibly if the remote tc8-dut build lacks it"
    return 0
}

topology_bring_up_worker() {
    local W=$1

    # Reap any tc8-dut left over from a previous run on the remote host
    # — a stale instance would steal the SD/UT ports from the per-case
    # fresh spawn and every verdict after that would be unexplainable.
    # pkill -x (exact comm match) — a -f pattern would match the ssh
    # session's own remote shell command line and kill it mid-flight.
    if _ssh_dut "pkill -KILL -x tc8-dut" ; then
        echo "smoke-test[ssh-remote]: reaped a stale remote tc8-dut from a previous run"
    fi

    local mac=${TC8_TOPOLOGY_DUT_MAC:-}
    if [[ -z "$mac" ]]; then
        mac=$(ip -4 neigh show "$TC8_TOPOLOGY_DUT_IP" dev "$TC8_TOPOLOGY_IFACE" 2>/dev/null \
            | awk '/lladdr/ { print $3; exit }')
        if [[ -z "$mac" ]]; then
            echo "smoke-test[ssh-remote]: failed to resolve the DUT MAC for $TC8_TOPOLOGY_DUT_IP on '$TC8_TOPOLOGY_IFACE' — set TC8_TOPOLOGY_DUT_MAC explicitly" >&2
            exit 1
        fi
        echo "smoke-test[ssh-remote]: DUT MAC resolved from neigh table: $mac"
    else
        echo "smoke-test[ssh-remote]: DUT MAC pinned by operator: $mac"
    fi
    echo "$mac" >"$WORK_ROOT/$W/dut_mac"

    cat "/sys/class/net/$TC8_TOPOLOGY_IFACE/address" >"$WORK_ROOT/$W/tester_mac"
}

topology_tear_down_worker() {
    # Last-resort remote reap; per-case topology_stop_dut already ran.
    _ssh_dut "pkill -KILL -x tc8-dut" 2>/dev/null || true
}

topology_tester_iface() {
    echo "$TC8_TOPOLOGY_IFACE"
}

topology_tester_iface_secondary() {
    echo "${TC8_TOPOLOGY_IFACE_SECONDARY:-}"
}

topology_exec_tester() {
    shift
    "$@"
}

topology_run_harness() {
    local W=$1 hlog=$2
    shift 2
    "$VSOMEIP_BASE/$W/tc8-harness" "$@" >"$hlog" 2>&1 &
    echo $!
}

# Start one fresh tc8-dut on the remote host. The local cfg path chosen
# by run_case (default or per-case flavor) is mapped to a sibling of
# TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG by basename.
# Args: W dlog local_vsomeip_cfg [extra env KEY=VALUE...]
topology_start_dut() {
    local W=$1 dlog=$2 cfg=$3
    shift 3
    local remote_cfg
    remote_cfg="$(dirname "$TC8_TOPOLOGY_REMOTE_VSOMEIP_CFG")/$(basename "$cfg")"
    # mkdir for the remote vsomeip scratch — vsomeip cannot create its
    # own base path and fails with a non-obvious routing-manager error
    # when it is missing.
    # shellcheck disable=SC2086
    ssh -n -o BatchMode=yes ${TC8_TOPOLOGY_SSH_OPTS:-} "$TC8_TOPOLOGY_SSH_TARGET" \
        "mkdir -p /tmp/tc8-remote-vsomeip-$W && \
         rm -f /tmp/tc8-remote-vsomeip-$W/vsomeip-* /tmp/tc8-remote-vsomeip-$W/vsomeip.lck && \
         ${TC8_TOPOLOGY_REMOTE_WRAP:-} env \
            COMMONAPI_CONFIG='$TC8_TOPOLOGY_REMOTE_CAPI_CFG' \
            VSOMEIP_CONFIGURATION='$remote_cfg' \
            VSOMEIP_APPLICATION_NAME=tc8-dut \
            VSOMEIP_BASE_PATH=/tmp/tc8-remote-vsomeip-$W/ \
            $* '$TC8_TOPOLOGY_REMOTE_DUT_BIN'" >"$dlog" 2>&1 &
    echo $!
}

topology_stop_dut() {
    # Kill the remote process (the local ssh client dies with the
    # connection teardown). pkill exits 1 when nothing matched — that is
    # the normal "DUT already exited" case, not an error.
    _ssh_dut "pkill -KILL -x tc8-dut; rm -rf /tmp/tc8-remote-vsomeip-*" \
        >/dev/null 2>&1 || true
}
