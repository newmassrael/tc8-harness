# Topology profile: lwip-tap
#
# The DUT is the lwIP unix-port stack (dut/lwip_dut/ — a real embedded TCP/IP
# stack, not the Linux reference DUT) attached to a host tap. smoke-test stands
# up the tap + one persistent tc8-lwip-dut, which answers ARP/ICMP/IP/UDP/TCP
# itself and serves the Upper Tester on UDP 30600. First-class successor to the
# examples/lwip-tap-fixture.conf overlay (which rode --topology external); the
# orchestrator's fixtures/lwip_tap.rs mirrors this profile so the two drivers
# share one dispatch axis (--topology lwip-tap on both).
#
# Build the DUT once:
#   git clone --depth 1 https://github.com/lwip-tcpip/lwip.git /tmp/lwip
#   cmake -S dut/lwip_dut -B build-lwip-dut -DLWIP_DIR=/tmp/lwip -DCMAKE_BUILD_TYPE=Release
#   cmake --build build-lwip-dut -j4
#
# Run:
#   sudo dut/env/smoke-test.sh --topology lwip-tap \
#        ICMPv4_TYPE_08 UDP_INTRODUCTION_03 TCP_BASICS_01
# Expected: 3x PASS. Full supported sweep + per-case known-fail rationale live in
# dut/lwip_dut/README.md + dut/lwip_dut/inventory_overrides.json. The standalone
# testability UTM is the optional override conf examples/lwip-utm-tap-fixture.conf.

TOPOLOGY_DESCRIPTION="lwIP embedded-stack DUT on a host tap (per-case respawn)"
# The DUT is a userspace TCP/IP stack, not a Linux kernel we can sysctl/neigh —
# per-case DUT-side conditioning is skipped + logged (same as external). ARP_48/49
# cache aging instead rides the UT 0x17 channel (TOPOLOGY_UT_ARP_CACHE_TIMEOUT_S).
TOPOLOGY_DUT_CONDITIONING=0
# --negative needs a Linux reference DUT + start-order tricks.
TOPOLOGY_SUPPORTS_NEGATIVE=0
# The fixture owns the DUT (spawned in provision_run, respawned in topology_stop_dut),
# so run_case must NOT also start one per case — 0, exactly as the overlay rode
# external's 0 while overriding stop_dut to respawn.
TOPOLOGY_SUPPORTS_DUT_SPAWN=0
# The tap, DUT pkill pattern and $LWIP_FIX_DIR are host-global (a flock guards them),
# so one shared fixture cannot serve parallel workers.
TOPOLOGY_MAX_WORKERS=1
# §4.2.4.2 ARP_48/49 cache conditioning rides the UT channel (0x17
# OpConditionArpCache) on this DUT — lwIP ages its ARP table at the compile-time
# ARP_MAXAGE, which dut/lwip_dut/lwipopts.h leaves at the lwIP default of 300 s.
# The value MUST track lwipopts.h: the trait stimulus ages the table by exactly
# this many virtual seconds to cross the stack's `age >= ARP_MAXAGE` free condition.
TOPOLOGY_UT_ARP_CACHE_TIMEOUT_S="$TC8_WIRE_ARP_CACHE_TIMEOUT_S"

# Fixed wire identity — single-homed in tools/wire.def (generated to
# $TC8_WIRE_*, sourced by smoke-test.sh before this profile) and shared with
# fixtures/lwip_tap.rs. LWIP_APP / LWIP_READY_PROBE / LWIP_KILL_NAME are resolved in
# topology_preflight, AFTER the optional --topology-conf override
# (examples/lwip-utm-tap.conf), not here.
LWIP_FIX_DIR="$TC8_WIRE_FIX_DIR"
LWIP_TAP="$TC8_WIRE_TAP"
LWIP_DUT_IP="$TC8_WIRE_DUT_IP"
LWIP_TESTER_IP="$TC8_WIRE_TESTER_IP"
# Tester-side `<AIface-0-IP>` alias (default kTesterAliasIp4Be) — §4.6.5.5
# UDP_USER_INTERFACE_08 directs the DUT to emit to this address, the host must
# answer ARP for it, and the readiness probe sources from it (cold-cache steering,
# below). The single-pc topology gets the same alias from setup-netns.sh.
LWIP_TESTER_ALIAS_IP="$TC8_WIRE_TESTER_ALIAS_IP"
# The harness asserts this alias via TC8_TOPOLOGY_TESTER_ALIAS_IP (smoke-test.sh
# init_expectation_defaults). Export it FROM the one alias source so the address the
# host answers ARP for and the address the harness expects can never drift apart
# (the orchestrator funnels both through wire::TESTER_ALIAS_IP; this is the bash peer).
export TC8_TOPOLOGY_TESTER_ALIAS_IP="$LWIP_TESTER_ALIAS_IP"
# Host-2 emulation (kUdpHost2IpBe) — UDP_FIELDS_04 directs the DUT to emit to a
# second host on the link, so its ARP query for 172.16.0.3 must get an answer. An
# external DUT's ARP cache is unreachable from the harness, so the fixture answers
# from the tap. /32 scope: host-local answerability only, no second routable subnet.
LWIP_HOST2_IP="$TC8_WIRE_HOST2_IP"
LWIP_LOCK_FILE="$TC8_WIRE_LOCK_FILE"
LWIP_LAST_DUT_LOG="$TC8_WIRE_LAST_DUT_LOG"

# ── Fixture lock ──────────────────────────────────────────────────────
# The tap name, the DUT pkill pattern and $LWIP_FIX_DIR are host-global, so two
# concurrent fixture users — a CI sweep on the self-hosted runner and a local dev
# run — silently corrupt each other (observed 2026-06-10 as a 4-case failure burst
# in the weekly sweep while a local run rebuilt the fixture). Fail fast instead.
# The lock fd stays open for the smoke-test.sh process lifetime and is released
# explicitly in topology_teardown_run. Acquired in topology_provision_run (the
# run-level main-shell hook that runs after preflight + the optional --topology-conf
# override and before the worker fan-out forks), so the fd lives in the main shell
# and is inherited by the worker subshells; a lock taken inside
# topology_bring_up_worker would release when that backgrounded bring-up subshell
# joins, long before the cases run.
#
# The fd is also inherited by every child smoke-test.sh spawns. A child that
# outlives its run keeps the lock held with no live owner and deadlocks every later
# fixture user (observed 2026-06-11: leaked workers held it and the weekly sweep
# aborted). Two defenses: the DUT spawn closes the fd explicitly, and a conflict
# whose holders include no live smoke-test.sh self-heals by reaping the leaked
# holders (only fixture-tree processes ever hold this file) and retrying once.
lwip_fixture_acquire_lock() {
    exec {LWIP_LOCK_FD}>"$LWIP_LOCK_FILE"
    if flock -n "$LWIP_LOCK_FD"; then
        return 0
    fi
    if ! command -v fuser >/dev/null; then
        echo "smoke-test[lwip-tap]: lock $LWIP_LOCK_FILE is held and fuser is unavailable to identify the holder (apt install psmisc) — aborting" >&2
        return 1
    fi
    local _pid _live_owner="" _leaked_holders=()
    for _pid in $(fuser "$LWIP_LOCK_FILE" 2>/dev/null | tr -c '0-9' ' '); do
        [[ "$_pid" == "$$" ]] && continue
        if grep -qa 'smoke-test' "/proc/$_pid/cmdline" 2>/dev/null; then
            _live_owner=$_pid
        else
            _leaked_holders+=("$_pid")
        fi
    done
    if [[ -n "$_live_owner" ]]; then
        echo "smoke-test[lwip-tap]: another smoke-test.sh (pid $_live_owner) holds the lwIP fixture (lock $LWIP_LOCK_FILE) — aborting instead of corrupting its run" >&2
        return 1
    fi
    if ((${#_leaked_holders[@]} == 0)); then
        echo "smoke-test[lwip-tap]: lock $LWIP_LOCK_FILE is held but no holder is visible — aborting" >&2
        return 1
    fi
    # TERM first, KILL backstop — a leaked tc8-lwip-dut among the holders must get
    # its SIGTERM slot abort (RST to tester halves); SIGKILLing a userspace stack
    # orphans them in FIN-WAIT-2, the exact failure lwip_fixture_kill_dut prevents.
    echo "smoke-test[lwip-tap]: lock held only by leaked children of a finished run (pid ${_leaked_holders[*]}) — reaping them and retrying" >&2
    kill -TERM "${_leaked_holders[@]}" 2>/dev/null || true
    local _attempt
    for _attempt in $(seq 10); do
        flock -n "$LWIP_LOCK_FD" && return 0
        sleep 0.05
    done
    kill -KILL "${_leaked_holders[@]}" 2>/dev/null || true
    for _attempt in $(seq 10); do
        flock -n "$LWIP_LOCK_FD" && return 0
        sleep 0.05
    done
    echo "smoke-test[lwip-tap]: lock still held after reaping leaked holders — aborting" >&2
    return 1
}

lwip_fixture_spawn_dut() {
    # {LWIP_LOCK_FD}>&-: the DUT must not inherit the fixture lock fd — a DUT
    # surviving a crashed smoke-test.sh would hold the lock and deadlock the next
    # run before its bring-up pkill could reap it.
    setsid env \
        PRECONFIGURED_TAPIF="$LWIP_TAP" \
        TC8_LWIP_DUT_IP="$LWIP_DUT_IP" \
        TC8_LWIP_DUT_MASK="$TC8_WIRE_DUT_MASK" \
        TC8_LWIP_DUT_GW="$LWIP_TESTER_IP" \
        "$LWIP_APP" >>"$LWIP_FIX_DIR/dut.log" 2>&1 </dev/null \
        {LWIP_LOCK_FD}>&- &
    disown
}

# Readiness probe instead of a fixed boot sleep: an OpPing / GET_VERSION round trip
# proves the tap link, the lwIP netif, and the UT/testability server bind + thread
# end to end. The "stack up" stderr line is NOT a sufficient signal — the server
# returns before the detached thread has bound its UDP port. Worst case ~5 s; the
# happy path converges in well under a second (an unbound port answers with ICMP
# port-unreachable and the probe fails fast).
#
# --source-ip pins the OPCODE probe to the tester ALIAS, NOT the primary tester IP:
# the DUT answers by ARP-resolving the probe's source, and this fixture has no way
# to flush the lwIP ARP table afterwards (per-case neigh conditioning is a Linux-
# netns affordance). Probing from the primary IP would hand every freshly respawned
# DUT a warm <172.16.0.1> entry and silently break the §4.2 cold-cache cases
# (ARP_07.., "DUT must emit its own ARP Request") whose premise is that entry's
# absence. The alias entry the probe warms (<172.16.0.4>) is harmless — no §4.2
# assertion references it. The testability probe has no --source-ip (a UTM fixture
# runs no §4.2 cold-cache case, so a warm primary-IP entry is harmless there).
lwip_fixture_wait_dut_ready() {
    local attempt
    for attempt in $(seq 25); do
        if [[ "$LWIP_READY_PROBE" == testability ]]; then
            if "$HARNESS" testability-probe --dut-ip "$LWIP_DUT_IP" \
                   --timeout 200 --no-data >/dev/null 2>&1; then
                return 0
            fi
        elif "$HARNESS" ut-ping --dut-ip "$LWIP_DUT_IP" --timeout 200 \
                 --source-ip "$LWIP_TESTER_ALIAS_IP" >/dev/null 2>&1; then
            return 0
        fi
        sleep 0.1
    done
    echo "smoke-test[lwip-tap]: DUT did not answer readiness probe ($LWIP_READY_PROBE) after spawn (see $LWIP_FIX_DIR/dut.log)" >&2
    return 1
}

lwip_fixture_socket_snapshot() {
    # Tester sockets toward the DUT still mid-close from the tester's side (`ss state
    # connected` covers everything but LISTEN and CLOSED). TIME-WAIT and FIN-WAIT-2
    # are excluded: in both the tester's FIN is already out (and ACKed), so nothing
    # more drains from this side. One "local peer" quad per line, sorted for comm(1).
    ss -H -tn state connected dst "$LWIP_DUT_IP" 2>/dev/null \
        | { grep -vE 'TIME-WAIT|FIN-WAIT-2' || true; } \
        | awk '{print $(NF-1), $NF}' | sort
}

# Drain BEFORE killing the DUT: the harness was just reaped and its tester-side
# sockets are closing; against a still-live lwIP their FINs complete normal
# exchanges (ACK / RST for unknown pcbs) and the sockets reach CLOSED / reopenable
# TIME-WAIT. Killing the DUT first turns every one into an orphaned FIN-WAIT-1 /
# LAST-ACK retransmitting into the void; once the next teardown removes the tap
# those orphans freeze with dead timers and answer the NEXT run's SYN on the same
# port quad with a stale challenge-ACK (observed: TCP_CLOSING_07 alternating
# pass/fail). `ss -K` is NOT a substitute — SOCK_DESTROY silently no-ops on this
# host. Drained = no socket beyond the bring-up baseline snapshot still mid-close.
# The baseline subtraction matters: this dev host carries ~11 permanently frozen
# FIN-WAIT-1 orphans toward the DUT IP from runs whose tap was deleted mid-close
# (counting them would make every poll time out). Polled (0.1 s tick, 2 s budget),
# loud warning on timeout because killing the DUT then risks the stale-challenge-ACK
# failure above.
lwip_fixture_drain_tester_sockets() {
    local attempt residual=0
    for attempt in $(seq 20); do
        residual=$(comm -23 <(lwip_fixture_socket_snapshot) \
                            <(printf '%s\n' "$LWIP_BASELINE_SOCKS") \
                       | grep -c . || true)
        if [[ "$residual" -eq 0 ]]; then
            return 0
        fi
        sleep 0.1
    done
    echo "smoke-test[lwip-tap]: WARNING — $residual tester socket(s) toward $LWIP_DUT_IP still mid-close after 2 s drain; the respawn below may orphan them (stale challenge-ACK risk on port-quad reuse)" >&2
}

# SIGTERM first, SIGKILL backstop: on TERM the DUT aborts every open UT slot (RST on
# the wire) before exiting, so tester-side halves of case-leaked connections reach
# CLOSED instead of orphaning in FIN-WAIT-2 — a userspace stack emits nothing on
# SIGKILL, unlike the Linux DUT whose kernel closes sockets on process death, and a
# FIN-WAIT-2 orphan swallows the next case's SYN when the respawned stack reuses the
# same deterministic port quad (observed: TCP_FLAGS_INVALID_09/_12/_13 phase-1
# timeouts in the first single-invocation full sweep).
lwip_fixture_kill_dut() {
    pkill -TERM -f "$LWIP_KILL_NAME" 2>/dev/null || true
    local attempt
    for attempt in $(seq 10); do
        pgrep -f "$LWIP_KILL_NAME" >/dev/null 2>&1 || return 0
        sleep 0.05
    done
    # Loud, not silent: SIGKILL here means the slot abort did not finish, so the
    # FIN-WAIT-2 orphan risk this teardown exists to prevent is back for this
    # boundary — a later same-quad SYN timeout should be read against this line.
    echo "smoke-test[lwip-tap]: WARNING — DUT ignored SIGTERM for 0.5 s, falling back to SIGKILL (UT slot abort incomplete; FIN-WAIT-2 orphan risk on reused quads)" >&2
    pkill -KILL -f "$LWIP_KILL_NAME" 2>/dev/null || true
}

# ── Profile contract hooks ────────────────────────────────────────────
# Pre-provision validation only — NO DUT liveness (the DUT is spawned in
# topology_provision_run). The LWIP_APP/READY_PROBE/KILL_NAME knobs are resolved
# here, after the optional --topology-conf override (standalone-UTM), so the binary-
# exists check and the later provision/teardown all see the same values.
topology_preflight() {
    : "${LWIP_APP:=$ROOT/build-lwip-dut/tc8-lwip-dut}"
    : "${LWIP_READY_PROBE:=opcode}"
    : "${LWIP_KILL_NAME:=tc8-lwip-dut}"

    if [[ ! -x "$LWIP_APP" ]]; then
        echo "smoke-test[lwip-tap]: preflight FAIL — DUT binary '$LWIP_APP' not found or not executable; build it first (see this profile's header)" >&2
        return 1
    fi
    local tool
    for tool in ip ss pkill pgrep flock; do
        command -v "$tool" >/dev/null \
            || { echo "smoke-test[lwip-tap]: preflight FAIL — '$tool' not found on PATH (needed for tap setup / socket drain / DUT reap)" >&2; return 1; }
    done
    return 0
}

# Stand up the single fixture DUT — the one main-shell run-level hook, after
# preflight + the --topology-conf override and before the worker fan-out forks, so
# the held lock fd and the socket baseline live in the main shell and are inherited
# by the worker subshells (a backgrounded bring-up subshell would release the lock
# on join). topology_teardown_run reaps it. Postcondition: a live lwIP DUT on the tap.
topology_provision_run() {
    # Lock (held by the main shell for the whole run), then provision the tap + DUT.
    lwip_fixture_acquire_lock || return 1
    pkill -KILL -f "$LWIP_APP" 2>/dev/null || true
    ip link del "$LWIP_TAP" 2>/dev/null || true
    rm -rf "$LWIP_FIX_DIR"
    mkdir -p "$LWIP_FIX_DIR"

    ip tuntap add dev "$LWIP_TAP" mode tap
    ip addr add "$LWIP_TESTER_IP/24" dev "$LWIP_TAP"
    ip addr add "$LWIP_TESTER_ALIAS_IP/24" dev "$LWIP_TAP"
    ip addr add "$LWIP_HOST2_IP/32" dev "$LWIP_TAP"
    ip link set "$LWIP_TAP" up

    # Snapshot pre-existing (frozen) sockets BEFORE spawning so the per-case drain
    # only waits on sockets this run created. Main-shell var → inherited by workers.
    LWIP_BASELINE_SOCKS=$(lwip_fixture_socket_snapshot)

    lwip_fixture_spawn_dut
    lwip_fixture_wait_dut_ready || return 1
    echo "smoke-test[lwip-tap]: provision OK — lwIP DUT $LWIP_APP up on $LWIP_TAP ($LWIP_READY_PROBE probe)"
    return 0
}

topology_bring_up_worker() {
    local W=$1
    # The fixture DUT is already up (provision_run); resolve + record its MAC from the
    # neigh entry the readiness probe warmed (the lwIP MAC is not operator-pinned).
    # The stack keeps the same MAC across per-case respawns (it re-attaches to the
    # persistent tap), so this entry stays valid for the worker's lifetime.
    local mac
    mac=$(ip -4 neigh show "$LWIP_DUT_IP" dev "$LWIP_TAP" 2>/dev/null \
        | awk '/lladdr/ { print $3; exit }')
    if [[ -z "$mac" ]]; then
        echo "smoke-test[lwip-tap]: failed to resolve the lwIP DUT MAC for $LWIP_DUT_IP on '$LWIP_TAP'" >&2
        exit 1
    fi
    echo "$mac" >"$WORK_ROOT/$W/dut_mac"
    cat "/sys/class/net/$LWIP_TAP/address" >"$WORK_ROOT/$W/tester_mac"
}

topology_tear_down_worker() {
    # Per-worker: nothing. The host-global tap/DUT/lock are run-level state, reaped
    # once in topology_teardown_run (this fixture is MAX_WORKERS=1).
    :
}

topology_teardown_run() {
    lwip_fixture_kill_dut
    ip link del "$LWIP_TAP" 2>/dev/null || true
    # Preserve the DUT log for postmortems; the run dir itself goes away.
    mv "$LWIP_FIX_DIR/dut.log" "$LWIP_LAST_DUT_LOG" 2>/dev/null || true
    rm -rf "$LWIP_FIX_DIR"
    # Explicit lock release, matched against lwip_fixture_acquire_lock's
    # `exec {LWIP_LOCK_FD}>"$LWIP_LOCK_FILE"`. Guarded — teardown runs on the EXIT
    # trap even if provisioning aborted before the lock was acquired. Closing the fd
    # drops the flock deterministically rather than relying on process exit.
    if [[ -n "${LWIP_LOCK_FD:-}" ]]; then
        exec {LWIP_LOCK_FD}>&-
    fi
}

topology_tester_iface() {
    echo "$LWIP_TAP"
}

topology_tester_iface_secondary() {
    # The in-tree lwIP fixture uses no secondary iface (Topology 2 on a tap is not
    # in the in-tree set).
    :
}

# The tester context is simply this host.
topology_exec_tester() {
    shift
    "$@"
}

topology_run_harness() {
    local W=$1 hlog=$2
    shift 2
    "$VSOMEIP_BASE/$W/tc8-harness" "$@" >"$hlog" 2>&1 &
    echo $!
}

# Contract stub: never invoked on the SUPPORTS_DUT_SPAWN=0 path, but a future caller
# must get a loud message, not a silent no-op.
topology_start_dut() {
    echo "smoke-test[lwip-tap]: BUG — topology_start_dut called although TOPOLOGY_SUPPORTS_DUT_SPAWN=0" >&2
    return 1
}

# Per-case DUT respawn: run_case calls this hook unconditionally at case teardown.
# Case stimuli hardcode the UT socket ids a freshly spawned DUT hands out (1, 2,
# ...), and passing cases legitimately leave auxiliary sockets open — on a truly
# persistent DUT the leaked slots shift every later case's id sequence. Respawning
# restores the per-case fresh-DUT semantics the Linux fixture gets from
# TOPOLOGY_SUPPORTS_DUT_SPAWN=1; the stack re-attaches to the persistent tap and
# keeps the same MAC, so the host-side neigh entry stays valid. Respawn / ready
# failure is a warning, not an abort: run_case calls this as a plain statement under
# `set -e`, and the established policy is "the next case fails visibly" rather than
# killing the whole worker from a teardown path.
topology_stop_dut() {
    lwip_fixture_drain_tester_sockets
    lwip_fixture_kill_dut
    lwip_fixture_spawn_dut
    lwip_fixture_wait_dut_ready || true
}
