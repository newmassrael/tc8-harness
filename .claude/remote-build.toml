# What tc8-harness needs from a build machine — REQUIREMENTS, never a machine name.
#
# WHY THIS FILE EXISTS. This was the only repository on this workstation without
# one, and the absence was not a decision: `bx` said so in as many words --
# "tc8-harness declares no .claude/remote-build.toml, so nothing says what to send
# or what it needs" -- and sent every build to this box. The box is also where the
# `[self-hosted, netns]` smoke runner lives, so this repository was competing with
# its own push gate. Measured 2026-09-24: a cache-warm harness build inside the
# gate took 59m03 against 8m14 on a quiet run, and the gate returned no verdict
# (docs/tech-debt.md TD-43).
#
# ⚠ Until then the only thing keeping the two apart was a HABIT -- "keep quiet
# after a push". A habit is not a mechanism. This file is the mechanism.
#
# ⚠⚠ THE REMOTE TREE IS A READ-ONLY VERIFICATION COPY. Commits, the mnemosyne
# citation gate and pushes are local by rule; anything edited over there is erased
# by the next rsync.

# Tracked files plus submodules. `third_party/vsomeip` is a submodule and the CI
# checkout takes it recursively, so a copy without it cannot configure the mock
# DUT. Untracked output (`build/`, `target/`, `reports/`, `smoke-logs/`) is left
# behind by this choice rather than by an exclude list -- see the note at the end.
send = "tracked+submodules"

# The executables the commands below invoke. bx asks each host whether it RUNS
# every name here before sending anything, so a host missing one is refused BY
# NAME instead of reddening a lane.
#
# ⚠ `sce-codegen` is in this list and it is the one that will surprise a reader.
# It is not built from the tree: `third_party/sce` ships SCEFindCodegen.cmake,
# which FINDS a generator, and this workstation's build resolves it to
# `~/.local/bin/sce-codegen`. Every one of the 543 case state machines is
# generated by it, so a machine without it builds nothing at all.
needs = ["cmake", "make", "g++", "python3", "git", "sce-codegen"]

# Measured against this repository's own find_package / link requirements rather
# than copied from a sibling. libpcap is present on both registered machines;
# libtins is on neither, and the tester links it for every dissector.
packages = ["libpcap-dev", "libtins-dev"]

min_ram_gb  = 16
min_free_gb = 40

# A rough per-compile-job figure for the thread-budget calculation, not a measured
# peak: the registrar chunking (TC8_CASES_PER_TU=32) keeps the largest
# translation units modest, and no single TU here has been seen near 2 GB.
peak_gb_per_task = 1

[commands]
# ⚠ MOCK DUT OFF, deliberately, and this is a real limitation rather than a
# tuning choice. `TC8_BUILD_MOCK_DUT=ON` pulls find_package(CommonAPI) and
# find_package(vsomeip3); no registered machine carries CommonAPI today. The
# hosted `build-test` lane already builds this same configuration for the same
# reason, so this is the shape the repository has verified off-box before.
#
# What it therefore does NOT cover: the vsomeip/CommonAPI ETS mock DUT under
# dut/ets. That build stays local until a machine carries CommonAPI.
build  = "cmake -S . -B build -DTC8_BUILD_MOCK_DUT=OFF -DTC8_BUILD_UNIT_TESTS=ON && cmake --build build"
# The privileged neighbour test self-wraps in an unprivileged user+net namespace
# and SKIPs (exit 77) where userns is unavailable, so this is safe on a machine
# with no netns provisioning. `--no-tests=error` because ctest EXIT-0s an empty
# suite, which would pass this gate vacuously.
verify = "ctest --test-dir build --output-on-failure --no-tests=error"

# ⚠ NO `exclude` KEY, and that is deliberate. `bx --explain-declaration` lists the
# keys it actually reads, and `exclude` is not among them -- five repositories on
# this machine declare it and none of those declarations has ever been read
# (measured 2026-08-14; scxml-core-engine's `/embed` is tracked and ships on every
# transfer while its declaration says otherwise). `send = "tracked+submodules"`
# already keeps this repository's build output at home, so there is nothing an
# exclude would add here except a line that looks enforced and is not.
