name: Build harness
description: >
  vsomeip patch-series reinstall + cmake configure + harness/tc8-dut
  build. Shared by smoke-test.yml and lwip-sweep.yml so the build
  recipe cannot drift between the push gate and the weekly sweep.
runs:
  using: composite
  steps:
    - name: Apply vsomeip patch series + reinstall (idempotent)
      # Re-runs `scripts/setup-vsomeip.sh` so the runner's vsomeip
      # install always matches `third_party/vsomeip` HEAD + the
      # checked-in `patches/vsomeip/series`. Without this, RPC_07/_08
      # (which depend on patches/vsomeip/0001-relax-return-code-on-requests)
      # would silently regress whenever the submodule SHA or patch
      # series changes between PRs.
      #
      # Installs to the job-scoped /opt/someip-stack (the build-test.yml
      # convention), NEVER to /usr/local: the runner host's /usr/local may
      # carry an operator-managed SOME/IP stack, and overwriting it (or the
      # DUT silently loading it mid-suite) corrupts both sides. The prefix
      # rides argv, not VSOMEIP_INSTALL_PREFIX, because the sudoers command
      # rule matches any argv while env assignment would need SETENV.
      # Runtime resolution needs no ldconfig/LD_LIBRARY_PATH: the harness
      # binaries carry a build RPATH to the prefix and libvsomeip3 carries
      # $ORIGIN for its dlopen'ed plugins (see setup-vsomeip.sh).
      #
      # NOPASSWD requirement: extend /etc/sudoers.d/tc8-runner so the
      # runner can invoke the checked-out setup-vsomeip.sh (and the
      # inner `sudo cmake --install`) without interactive auth. See
      # README §CI for the full sudoers fragment.
      shell: bash
      run: sudo -n ./scripts/setup-vsomeip.sh /opt/someip-stack

    - name: Configure
      # CMAKE_PREFIX_PATH steers find_package(vsomeip3) to the job-scoped
      # install above — deterministic even when /usr/local holds a foreign
      # vsomeip. CommonAPI still resolves from the host (/usr/local).
      #
      # ccache (when present) launches every compile. The checkout wipes build/
      # before each run (clean: true, the hermetic default we keep), so without a
      # content-addressed cache the 500+ case-stub objects recompile cold every
      # time — ~16 min idle, minutes-to-hours under host contention. ccache turns
      # that into cache hits keyed on preprocessed source + flags (identical
      # output), and its ~/.cache/ccache store lives outside the workspace so the
      # wipe never touches it. Absent ccache the configure is unchanged.
      #
      # CCACHE_BASEDIR is what lets those hits cross CHECKOUTS. Without it every
      # -I on the command line is an absolute path under the workspace, so this
      # runner's entries and a developer tree's entries for the identical commit
      # are distinct — two full copies in one shared cache, and neither warms the
      # other. Set to the workspace root, ccache rewrites paths beneath it to
      # relative before hashing, and the two collapse into one working set (which
      # also halves what this repo occupies in a cache that is measurably
      # evicting: 37.9/50 GB with 4035 cleanups on 2026-08-24).
      #
      # It pairs with the generated case stubs including their traits header by a
      # RELATIVE path (src/harness/CMakeLists.txt) — basedir normalises the
      # command line, that normalises the SOURCE TEXT, and a direct-mode hit needs
      # both. CCACHE_NOHASHDIR drops the build directory from the hash for the
      # same reason; it is safe here because these are -DCMAKE_BUILD_TYPE=Release
      # objects with no debug info to carry a stale path.
      shell: bash
      run: |
        export CMAKE_PREFIX_PATH=/opt/someip-stack${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}
        ccache_args=()
        if command -v ccache >/dev/null 2>&1; then
          ccache_args=(-DCMAKE_C_COMPILER_LAUNCHER=ccache
                       -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          # Exported for the BUILD step too, not just this one: ccache reads them
          # when it launches each compile, which happens in the next step.
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE:-$PWD}"
            echo "CCACHE_NOHASHDIR=1"
          } >> "$GITHUB_ENV"
        fi
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DTC8_SCE_FIND_PACKAGE=OFF \
          "${ccache_args[@]}"

    - name: Build harness + tc8-dut
      shell: bash
      run: cmake --build build -j4
