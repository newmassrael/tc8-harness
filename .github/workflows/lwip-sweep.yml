name: lwip-sweep

on:
  # On-demand full sweep of every case the lwIP DUT fixture can
  # meaningfully pass (dut/lwip_dut/sweep-cases.sh emits the list; the
  # external topology is capped at one worker because the fixture is a
  # single shared DUT). The push-triggered smoke-test workflow re-runs
  # a small lwIP regression slice on every push; this job is the
  # one-button full validation, dispatched when there is new evidence
  # to gather rather than on a timer (an unchanged SHA re-validates
  # nothing):
  #   * lwIP pin bump (dut/lwip_dut/LWIP_PIN) — mandatory, see the
  #     README "Running the sweep" contract;
  #   * session close-out for changes touching the lwIP fixture or
  #     shared harness paths;
  #   * refreshing the dated sweep table in dut/lwip_dut/README.md.
  # (A weekly cron ran 2026-06-11..2026-06-11; retired because every
  # axis it guarded is covered per-push or per-session, and the
  # serialized self-hosted runner paid ~30 min/week for it.)
  #
  # Self-hosted runner: same fork-PR code-execution constraint as
  # smoke-test.yml — manual dispatch only, never pull_request.
  workflow_dispatch: {}

permissions:
  contents: read
  # dorny/test-reporter@v3 needs `checks: write` to publish the JUnit
  # check run (see smoke-test.yml for the failure mode without it).
  checks: write

jobs:
  sweep:
    name: lwIP full sweep (single invocation) on self-hosted [netns]
    runs-on: [self-hosted, netns]
    # Warm runs are ~50 min sweep + a few min incremental build; the
    # cold path (vsomeip rebuild + 543 SCXML codegen + harness + lwIP
    # clone/build) adds up to ~90 min on a mid-tier machine.
    timeout-minutes: 150
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build harness (vsomeip + cmake)
        # Shared recipe — see .github/actions/build-harness/action.yml.
        uses: ./.github/actions/build-harness

      - name: Build lwIP DUT (pinned)
        # Shared with smoke-test.yml — pin + cache + pin-forward policy
        # live in .github/actions/build-lwip-dut/action.yml.
        uses: ./.github/actions/build-lwip-dut

      - name: Run full sweep (single invocation + JUnit)
        # Case selection comes from dut/lwip_dut/sweep-cases.sh — the
        # single source shared with the README's "Running the sweep"
        # command (overrides ledger + category-filter rationale live in
        # the script header). Deliberately ONE smoke-test.sh invocation
        # rather than per-category chunks, so cross-case state
        # (port-quad reuse, per-case fixture respawn) is exercised the
        # way a certification run would see it.
        run: |
          mkdir -p reports
          sudo -n dut/env/smoke-test.sh \
            --topology external \
            --topology-conf dut/env/topology.d/examples/lwip-tap-fixture.conf \
            --junit-xml reports/junit-lwip-sweep.xml \
            $(dut/lwip_dut/sweep-cases.sh)

      - name: Run testability-backend TCP slice (--dut-control testability)
        # The full sweep above drives the in-house opcode UT backend. This
        # pass re-runs the TCP seam cases against the AUTOSAR Testability
        # backend (--dut-control testability, port 30700) so the lwIP
        # TestabilityTcpControl / TestabilityUdpControl adapters are
        # exercised on the wire by conformance cases, not just the
        # testability-probe liveness smoke. Seam cases needing opcode-only
        # capabilities (kernel-state probe / OOB receive / SYN-SENT open)
        # conditioning-skip honestly rather than fail. TCP carries every
        # seam case (driveSeam* is TCP-only), so the grep is the slice.
        run: |
          sudo -n dut/env/smoke-test.sh \
            --topology external \
            --topology-conf dut/env/topology.d/examples/lwip-tap-fixture.conf \
            --dut-control testability \
            --junit-xml reports/junit-lwip-sweep-testability.xml \
            $(dut/lwip_dut/sweep-cases.sh | grep '^TCP_')

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-lwip-sweep
          path: reports/

      - name: Publish JUnit summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: lwip full sweep
          path: reports/junit-*.xml
          reporter: java-junit
