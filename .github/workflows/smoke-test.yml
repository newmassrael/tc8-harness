      # Observable ETH INTERFACE_DOWN/UP service primitive check (PRS_TPSP
      # §6.10). A Topology-2 dual-veth netns + the standalone tc8-utm:
      # testability-probe --eth toggles the DUT's SECONDARY interface over the
      # PRIMARY control channel and observes the secondary go unreachable then
      # reachable again. ETH's effect — unlike ICMP's — is observable end to end,
      # so the probe asserts the effect, not just E_OK. The one testability SP
      # with no TC8-case driver, verified here against the deployable UTM. ~5 s.
      - name: Testability ETH SP observable check
        run: sudo -n dut/env/testability-eth-sp-check.sh

      # Observable IP STATIC_ADDRESS / STATIC_ROUTE service primitive check
      # (PRS_TPSP §6.10). The same Topology-2 dual-veth netns + standalone tc8-utm:
      # testability-probe --ip-static assigns a fresh address to the DUT's SECONDARY
      # interface over the PRIMARY control channel and observes it become reachable,
      # then installs a route and the check confirms it landed in the DUT's table.
      # The E_OK assignment path the hermetic unit tests skip (a privileged write
      # would mutate the build host), verified here against the deployable UTM. ~5 s.
      - name: Testability IP STATIC SP observable check
        run: sudo -n dut/env/testability-ip-static-check.sh

      # Observable IPv6 STATIC_ADDRESS / STATIC_ROUTE service primitive check
      # (PRS_TPSP §6.10, GID 0x06). The IPv6 mirror of the IP STATIC check above:
      # testability-probe --ipv6-static assigns a fresh IPv6 to the DUT's SECONDARY
      # interface over the (IPv4) PRIMARY control channel; the script then observes the
      # address is ping6-reachable and the route landed in the DUT's table. Both are
      # observed here (the IPv4 testability transport cannot self-observe an IPv6 addr).
      # The E_OK path the hermetic unit tests skip, verified against the deployable UTM.
      - name: Testability IPv6 STATIC SP observable check
        run: sudo -n dut/env/testability-ipv6-static-check.sh

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports
          path: reports/

      # A harness `error:` verdict (a test-system non-conclusion — e.g. an unresolved
      # DUT capability query) is mapped to a JUnit <skipped>, so the run stays GREEN
      # and the failure-only upload below would never fire — discarding the very
      # diagnostic that explains the flake. Detect those error-class skips (they carry
      # the `error:` prefix; deterministic skips use `skip:`) so diagnostics are kept
      # for them too. Verified discriminator: a green run's 132 skips carried exactly
      # one `error:` (the flake); the other 123 were legitimate `skip:`.
      - name: Detect error-class verdicts in JUnit
        id: junit_errors
        if: always()
        run: |
          if grep -rq 'message="error:' reports/ 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "error-class verdicts (preserving diagnostics despite a green run):"
            grep -rho 'message="error:[^"]*"' reports/ | sort -u
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The JUnit above carries only the verdict string. The WHY — a "no verdict line"
      # crash/timeout, the DUT's stderr, the wire trace — lives in the per-case harness
      # log, DUT log, and pcap that each step's `--log-dir smoke-logs/<step>` captured.
      # `gh run view --log` returns nothing for this self-hosted job, so without this
      # upload that evidence vanishes with the runner and every failure — or GREEN
      # error-skip flake — becomes guesswork. Fires on failure OR an error-class skip,
      # so a flake that stays green still preserves its logs; ordinary green runs cost
      # no artifact storage. (The Testability SP checks below use standalone probe
      # scripts, not smoke-test.sh, so they have no --log-dir to feed this.)
      - name: Upload harness logs + pcaps (failure or error-skip)
        if: ${{ failure() || steps.junit_errors.outputs.found == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: smoke-diagnostics
          path: smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit summary to PR
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: tc8 smoke
          path: reports/junit-*.xml
          reporter: java-junit
