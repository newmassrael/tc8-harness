name: smoke-test

on:
  # Self-hosted runner: do NOT trigger on pull_request from public
  # forks — that would let an attacker run arbitrary code on the
  # runner host by submitting a malicious workflow patch in a PR.
  # Only maintainer-controlled triggers (push to main, manual
  # dispatch) are allowed. PR review for fork contributions falls
  # back to the hosted build-test workflow.
  push:
    branches: [main]
    # Skip pure-site / pcap-tooling pushes — none of those affect C++
    # behaviour, so smoke-test would just waste runner time.
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
      - 'docs/spec/deprecated_cases.json'
  workflow_dispatch: {}

# A newer push to the same ref cancels an older in-flight run of THIS workflow —
# the conformance verdict only cares about HEAD, and on the single self-hosted
# netns runner a superseded run would otherwise pin the host for ~1 h (exactly
# the 117b4c70-vs-688a843d pile-up that motivated this). Per-workflow group
# (github.workflow) so smoke-test never cancels build-test or mnemosyne.
# workflow_dispatch runs share the group too (a manual re-run supersedes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/test-reporter@v3 creates per-job check runs to surface
  # JUnit failures inline on the commit page; that needs the
  # `checks: write` scope. Without it the publish step exits 1
  # even when every smoke case passed.
  checks: write

jobs:
  smoke:
    name: tc8-orchestrator (--workers 4) on self-hosted [netns]
    # [skip smoke] opt-out — a commit whose HEAD message contains the literal
    # marker `[skip smoke]` skips THIS netns sweep only (build-test + mnemosyne
    # still run, so build/link + citation gates are never bypassed). Use it
    # ONLY when BOTH hold: (1) the change is genuinely behaviour-preserving
    # (renames, comment/doc edits, dead-code removal, CMake-comment tweaks),
    # and (2) the offline build + ctest are already green. A conformance / wire
    # regression is exactly what this sweep catches, and "behaviour-preserving"
    # is a claim the sweep sometimes disproves — so the DEFAULT is to let it
    # run; the marker is a sparingly-used escape hatch, never a way to force a
    # push through under time pressure. Manual workflow_dispatch always runs
    # (head_commit is absent, so the marker check is false).
    if: ${{ !contains(github.event.head_commit.message, '[skip smoke]') }}
    # Self-hosted runner with the `netns` label provisioned for veth-pair
    # bring-up + sudo NOPASSWD for /home/<runner>/tc8-harness/dut/env/smoke-test.sh.
    # See README.md §CI for setup notes.
    #
    # `--workers 4` is the production CI configuration. The earlier
    # workers=1 strategy was a temporary workaround for a deterministic
    # TCP_RETRANSMISSION_TO_03 flake under parallel load — the kernel's
    # high-resolution retx timer fires later than expected when system
    # CPU is saturated by 4 concurrent workers. Phase 9 replaced the
    # case's pcap-timing observation with a kernel-side TCP_INFO poll
    # (OpQueryTcpInfo, opcode 0x13) that is timing-noise-tolerant by
    # construction; the workaround was retired alongside the fix.
    runs-on: [self-hosted, netns]
    # Cold build (vsomeip rebuild + 543 SCXML codegen + harness +
    # tc8-dut + unit tests) plus 549-case positive smoke plus
    # negative curated set on a mid-tier developer machine totals
    # ~90 min. Subsequent runs reuse cmake incremental + actions/cache
    # so they fit in ~25 min — we set the cap high enough for the cold
    # path and rely on the test logic to hard-fail rather than the
    # timer to bound runtime.
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      # Steer every cmake configure in this job (build-harness sets its own,
      # but check-suite-producer.sh configures fresh trees) to the job-scoped
      # vsomeip install — the runner host's /usr/local may carry an
      # operator-managed SOME/IP stack that CI must neither overwrite nor
      # silently load (see build-harness).
      CMAKE_PREFIX_PATH: /opt/someip-stack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build harness (vsomeip + cmake)
        # Shared recipe — see .github/actions/build-harness/action.yml
        # for the vsomeip patch-series and sudoers rationale.
        uses: ./.github/actions/build-harness

      - name: Build orchestrator (drives the smoke lanes below)
        # The Rust successor DRIVES the lanes below; smoke-test.sh (the bash driver)
        # and the parity-check gate were retired once the orch reached full parity.
        # The runner's NOPASSWD sudoers lets `sudo -n .../tc8-orchestrator` work.
        working-directory: dut/env/orchestrator
        run: cargo build

      - name: Suite producer coexistence ratchet
        # Full proof that an out-of-tree OEM suite reusing an in-tree case id
        # builds + registers + coexists (the link/compile half the build-test
        # configure gate cannot reach). Self-hosted: a clean harness-only build
        # is cheap here. Asserts tc8:/demo:SOMEIPSRV_OPTIONS_01 both list.
        run: ./scripts/check-suite-producer.sh "${{ runner.temp }}/suite-producer" 4

      - name: Run host unit tests (DUT + engines, ctest)
        # build-test runs ctest too, but with -DTC8_BUILD_MOCK_DUT=OFF, so the
        # DUT-gated suites never execute there: testability_server_test (incl. the
        # neighbor / ARP-cache backend ops), posix_neighbor_privileged, reactor_test,
        # utm_export_smoke. This runner built the harness with the mock DUT ON
        # (build-harness default), so the assertions only become a CI gate here.
        # No sudo: the privileged neighbor test self-wraps in an unprivileged
        # user+net namespace (scripts/run-netns-test.sh) and SKIPs (exit 77) where
        # userns is unavailable, rather than failing.
        # --no-tests=error: ctest's default EXIT-0s an empty suite, so a build that
        # silently stopped producing these tests would pass the gate vacuously;
        # error out instead so the gate fails loud (verified: empty dir -> exit 8).
        run: ctest --test-dir build --output-on-failure --no-tests=error -j4

      - name: Run positive smoke (--workers 4 + JUnit)
        # Two harness-side filters apply, both reading
        # docs/spec/inventory_overrides.json as the single source of
        # truth (no inline regex maintenance burden):
        #   * `--exclude-deferred` drops cases marked `expected:false`
        #     (spec gap — harness intentionally cannot cover; today
        #     empty by project policy that platform deviations belong
        #     on the second axis instead).
        #   * `--exclude-platform-known-fail` drops cases marked
        #     `platform_known_fail:true` — kernel/userland deviations
        #     from RFC MUST/SHOULD that fail on the Linux DUT but pass
        #     on a strict-RFC DUT. CI green here therefore means "no
        #     regression in cases the Linux DUT is capable of passing".
        #     Per-case rationale + memory cross-references live in
        #     each entry's `platform_known_fail_ref`.
        #   * `--exclude-serial` drops cases marked `timing_serial:true`
        #     (sub-second cadence windows) — they run UNCONTENDED in the
        #     next step, since 4-way CPU contention starves the DUT's
        #     timer and skews the interval (see that step).
        # When the harness later runs against a strict-RFC DUT, drop
        # the second flag — the marked cases land green there.
        run: |
          # Pre-create reports/ AND every smoke-logs/<step> as the runner user
          # (NOT root) so the sudo'd smoke-test.sh writes only root-owned FILES
          # into runner-owned dirs — git clean (runner user) can then remove them
          # on the next checkout. A root-owned dir here fails `git clean` (exit
          # 128) and blocks all future checkouts. Mirrors how reports/ is created
          # once here and reused by every later step.
          mkdir -p reports \
            smoke-logs/positive smoke-logs/serial smoke-logs/negative \
            smoke-logs/topology-external smoke-logs/topology-ssh-remote \
            smoke-logs/lwip-dut
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --workers 4 \
            --junit-xml reports/junit-smoke-positive.xml \
            --log-dir smoke-logs/positive \
            $(./build/tc8-harness test --list-cases \
                --exclude-deferred --exclude-platform-known-fail --exclude-serial \
              | awk '/^  [A-Z]/{print $1}')

      - name: Run timing-cadence cases serially (--workers 1 + JUnit)
        # Cases marked `timing_serial:true` in inventory_overrides.json verify a
        # strict sub-second inter-frame cadence (frame_delta_within_us) — e.g. the
        # DHCPv4 retransmission backoff windows. Under --workers 4 the reference
        # DUT is CPU-starved and emits late, pushing the measured interval out of
        # the spec window (a test-environment artifact, not a DUT fault). Running
        # them alone gives the DUT the host's CPU so it emits on time, mirroring a
        # conformance lab's dedicated DUT. Separate JUnit file (junit_emit_xml
        # clobbers); dorny/test-reporter globs reports/junit-*.xml.
        run: |
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --workers 1 \
            --junit-xml reports/junit-smoke-positive-serial.xml \
            --log-dir smoke-logs/serial \
            $(./build/tc8-harness test --list-cases \
                --only-serial \
              | awk '/^  [A-Z]/{print $1}')

      - name: Run negative curated set (--workers 4)
        run: |
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --workers 4 \
            --junit-xml reports/junit-smoke-negative.xml \
            --log-dir smoke-logs/negative \
            --negative

      # Topology-profile regression: the external / ssh-remote profiles
      # are exercised against the self-contained netns fixtures in
      # dut/env/topology.d/examples/ (a persistent "external ECU" and an
      # "SSH-reachable second PC" with a dedicated sshd, both emulated
      # on this runner — no extra hardware). single-pc is already
      # covered by the two steps above; without these, a smoke-test.sh
      # change could silently break the OEM deployment paths and only
      # surface months later in a customer lab. Each run covers the
      # whole profile path: preflight (iface / ICMP / UT OpPing probe /
      # SSH + remote-binary checks), per-case DUT handling, and the
      # execution-ledger summary. ~1 min combined.
      - name: Topology profile regression — external (netns fixture)
        run: |
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --topology external \
            --topology-conf dut/env/orchestrator/examples/external-netns-fixture.toml \
            --junit-xml reports/junit-smoke-topology-external.xml \
            --log-dir smoke-logs/topology-external \
            ICMPv4_TYPE_08 UDP_INTRODUCTION_03

      - name: Topology profile regression — ssh-remote (netns fixture)
        run: |
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --topology ssh-remote \
            --topology-conf dut/env/orchestrator/examples/ssh-remote-netns-fixture.toml \
            --junit-xml reports/junit-smoke-topology-ssh-remote.xml \
            --log-dir smoke-logs/topology-ssh-remote \
            SOMEIPSRV_FORMAT_01 ICMPv4_TYPE_08

      # lwIP DUT regression: the in-repo embedded-stack DUT
      # (dut/lwip_dut/, --topology lwip-tap) drives a real non-Linux
      # TCP/IP stack. The case list deliberately
      # touches every fixture mechanism once: ICMP echo + closed-port
      # ICMP error (stack basics), passive/active UT opens + the
      # QueryTcpEstablished poll (TCP_BASICS_01..03), tcp_abort RST
      # path (CALL_ABORT_02), shutdown(WR)+recv (CLOSING_07), raw
      # passive handshake under TesterAutoRstDrop (MSS_OPTIONS_02),
      # IP_REASS_MAXAGE alignment (REASSEMBLY_10), a 5-phase case
      # exercising per-case respawn + ss -K + AckDrop + RFC 7323
      # timestamps (FLAGS_INVALID_09), and the UDP UT opcode family —
      # receipt log + directed-broadcast deny (IPv4_ADDRESSING_02,
      # 0x01), caller-specified src-IP emit via udp_sendto_if_src +
      # tap alias (UDP_USER_INTERFACE_07, 0x02), ephemeral
      # receive-port creation (UDP_USER_INTERFACE_01, 0x14), and the
      # §4.2 cold-cache premise — the ut-ping preflight's --source-ip
      # alias pin keeps the primary tester IP unresolved so the DUT's
      # UT-provoked egress must emit its own ARP Request (ARP_07).
      # Then the §4.2 ARP egress-fault self-validation cluster
      # (ARP_07/08/09/10/11/12/46/47_NEG, UT 0x18 OpSetArpFlavor): each
      # arms one kArpFault* flavor so the lwIP netif link-output hook
      # corrupts a single RFC 826 header field of the DUT-emitted Request
      # (07..12) or Reply (46/47), and the _neg passes only when that
      # violation is observed — the empirical proof the Phase F lwIP
      # ratchet (tools/fault_injection_floor.txt: lwip) counts. Faultable
      # only here (capability-skipped on Linux via OpQueryCapabilities);
      # the per-case DUT respawn + MAX_WORKERS=1 keep the process-global
      # flavor from leaking into the positive ARP_07 or the next case.
      # Then the §4.2.4.2 reply-absence INGRESS cluster
      # (ARP_21/27/37/42_NEG, kArpFaultReplyToDropFrame): the conformant DUT
      # drops the injected malformed/foreign frame and emits nothing, so the
      # netif INPUT hook synthesizes the prohibited ARP Reply — the _neg
      # passes only when that reply is observed. Finally the §4.2.4.2
      # drop-and-emit INGRESS cluster (ARP_22/28/38_NEG,
      # kArpFaultLearnFromDropFrame): the input hook forces the dropped
      # Response's address into the ARP table as a static entry, so the DUT's
      # UT-provoked UDP egress uses the injected MAC — the _neg passes only
      # when that UDP is observed. Then the §4.6.5.4 UDP acceptance INGRESS
      # cluster (UDP_FIELDS_09/10/15_NEG + DATAGRAMLENGTH_01_NEG,
      # kUdpFaultAcceptBadChecksum): the input hook zeroes the inbound UDP
      # checksum so lwIP delivers a datagram its checksum check must drop — the
      # _neg passes only when the UT GetReceivedUdp confirmation reports receipt.
      # Finally the §4.6.5.4 UDP rejection INGRESS cluster (UDP_FIELDS_03/16_NEG,
      # kUdpFaultRejectValid): the input hook swallows the valid data-listener
      # frame so lwIP never delivers it — the _neg passes only when the
      # confirmation reports NO receipt. Last the §4.8 TCP egress field cluster
      # (TCP_SEQUENCE_01_NEG kTcpFaultSynAckAckWrong, TCP_CHECKSUM_03_NEG /
      # TCP_HEADER_01_NEG kTcpFaultDataChecksumWrong, TCP_BASICS_04_NEG
      # kTcpFaultRstSeqWrong, TCP_MSS_OPTIONS_11_NEG kTcpFaultSynMssZero,
      # TCP_MSS_OPTIONS_12_NEG kTcpFaultSynMssDefault): the link-output hook corrupts
      # one field of a specific DUT segment (SYN,ACK ack / DATA checksum / closed-port
      # RST seq / active-OPEN SYN MSS) — the _neg passes only when the corrupted field
      # is observed on the captured segment. Then the §4.3/§4.4 ICMPv4 + IPv4-header
      # egress cluster on the DUT's Echo Reply (ICMPv4_TYPE_09_NEG/_NEG2
      # kIcmpFaultEchoId/EchoSeqWrong, IPv4_TTL_01_NEG kIpv4FaultTtlZero,
      # IPv4_CHECKSUM_05_NEG kIpv4FaultHdrChecksumWrong): the hook corrupts the Echo
      # Reply's echo id/seq, IPv4 TTL, or IPv4 header checksum — the _neg passes only
      # when that violation is observed. Finally the egress remainder closeout
      # (ICMPv4_TYPE_18_NEG kIcmpFaultDestUnreachCodeWrong flips the Dest Unreachable
      # code; TCP_BASICS_05_NEG/_NEG2 reuse kTcpFaultRstSeqWrong to flip the closed-port
      # RST seq off the incoming ACK; UDP_USER_INTERFACE_06_NEG reuses kUdpFaultDstPortWrong
      # to rewrite the DUT egress destination port off 20026; UDP_INTRODUCTION_03_NEG reuses
      # kIcmpFaultDestUnreachCodeWrong to flip the code of the DUT's UDP-elicited Port
      # Unreachable off 3). Last, the §4.4.4.5 APP-LAYER reception fault
      # (IPv4_ADDRESSING_02_NEG kAppFaultAcceptDirectedBroadcast): the IP stack
      # delivers the directed broadcast (ADDRESSING_02) / all-systems multicast
      # (INTRODUCTION_02) to the INADDR_ANY data-listener socket and the shared data
      # listener skips its RFC 1122 destination-address discard (a post-delivery app
      # decision, not a wire mutation) — the _neg passes only when the UT GetReceivedUdp
      # confirmation reports receipt. Last the §4.8.6.16 TCP
      # multi-phase ack cluster (TCP_HEADER_02/05/06_NEG kTcpFaultPureAckNumWrong): the
      # observed ack_num is on the DATA-elicited ACK, so the flavor is armed PER-PHASE —
      # the handshake is driven disarmed (third-leg ACK escapes), then armed before the
      # data injection so the link-output hook flips only the data-ACK's ack_num — the
      # _neg passes only when that wrong ack_num is observed. Finally a reuse cluster
      # (no new flavor): INTRODUCTION_01 (directed-broadcast app deny, reuses
      # kAppFaultAcceptDirectedBroadcast), MessageFormat_02 + ADDRESSING_01 (reuse the
      # kUdpFaultRejectValid ingress swallow), USER_INTERFACE_05 (reuses the
      # kUdpFaultSrcPortWrong egress rewrite). Then a TCP ack/RST reuse cluster:
      # ACKNOWLEDGEMENT_02/03 + SEQUENCE_02 reuse kTcpFaultPureAckNumWrong (02/03
      # per-phase on the data-ACK, SEQUENCE_02 arm-before on the handshake ACK), and
      # FLAGS_INVALID_02 reuses kTcpFaultRstSeqWrong on the LISTEN RST; SEQUENCE_03/04
      # reuse kTcpFaultSynAckAckWrong on the passive-open SYN,ACK ack_num (tester ISN 0
      # / wrap-around 2^32-1). Finally the §4.3 ICMPv4 prohibited-emission INGRESS
      # synthesis cluster (ICMPv4_TYPE_16/TYPE_10/TYPE_05/TYPE_04/ERROR_03/ERROR_04/ERROR_05_NEG,
      # UT 0x19 OpSetIngressFlavor): the conformant DUT stays silent for each trigger (Info
      # Request / bad-checksum Echo / malformed IP options / incomplete reassembly / unknown type
      # / broadcast or fragmented options), so the netif
      # INPUT hook synthesizes the prohibited ICMP reply (Information Reply / Echo Reply /
      # Time Exceeded / Parameter Problem) — the ICMP sibling of the ARP reply-absence cluster, and the
      # _neg passes only when that DUT-origin reply is observed. The same Echo-Reply synthesis
      # extends to the §4.4 IPv4-header must-not-reply guards (IPv4_ADDRESSING_03 / CHECKSUM_02 /
      # HEADER_04 / HEADER_02 / HEADER_08 / HEADER_09 / VERSION_04_NEG): a loopback /
      # bad-checksum / non-local-destination / IHL<5 / IHL*4>TotLen / oversized-Total-Length /
      # wrong-version Echo Request the DUT must drop draws a synthesized Echo
      # Reply, the IPv4-layer sibling of the §4.3 triggers. It reaches the §4.4.4.7
      # reassembly must-not-reply guards the same way (IPv4_REASSEMBLY_06/07/09_NEG): a
      # fragment bucket with no offset=0 head / an internal gap / a lone MF=1 fragment the DUT
      # can never reassemble draws a synthesized Echo Reply (the hook gates on the ICMP
      # protocol byte, never the fragment offset).
      # Finally the §4.6.5.5 UDP
      # User-Interface + §4.6.5.4 FIELDS app-report fault cluster (UDP_USER_INTERFACE_01/02/03/04_NEG
      # + UDP_FIELDS_12_NEG, UT 0x1A
      # OpSetAppFlavor): the datagram is received correctly but the shared data listener
      # surfaces a wrong field (port count / payload / src port / src IP / reassembled length) in
      # the UT Confirmation — the report-corruption sibling of the app-layer discard faults, faulted
      # at the only faithful site (the stack delivered it correctly), and the _neg passes only
      # when the corrupted field is observed. Finally the §4.8 TCP behavioral-synthesis pilot
      # (TCP_ACKNOWLEDGEMENT_04_NEG, kTcpSynthRst): the DUT must stay silent for a pure ACK in
      # ESTABLISHED, so the netif INPUT hook synthesizes the prohibited RST on the connection's
      # 4-tuple (swapped from the inbound trigger; the guard checks only 4-tuple + RST flag, no
      # seq) — the behavioral seam the egress field-fault cannot reach, and the _neg passes only
      # when that DUT-origin RST is observed. Then the §4.8.6.16 must-not-challenge-ACK cluster
      # (TCP_HEADER_07/08/09/11_NEG, kTcpSynthAck): the DUT must silently drop a malformed (bad
      # data offset / zero checksum) or multicast-destination segment, so the hook synthesizes
      # the prohibited challenge ACK on the connection 4-tuple — the _neg passes only when that
      # DUT-origin pure ACK is observed. The §4.8.6.2 CHECKSUM_02_NEG reuses the same kTcpSynthAck
      # flavor for a corrupt-TCP-checksum data segment the DUT must drop without acknowledging.
      # Finally the §4.8 must-not-respond cluster
      # (TCP_FLAGS_INVALID_03/04_NEG + TCP_FLAGS_PROCESSING_11_NEG, kTcpSynthRstOnDisruptive /
      # kTcpSynthRst): the DUT must drop an ACK-RST or bare RST in SYN-SENT, and ignore a
      # duplicate ACK in ESTABLISHED, without responding; the hook synthesizes the prohibited
      # RST when the disruptive segment arrives — the _neg passes only when that DUT-origin RST
      # is observed. The §4.8.6.8 close-state siblings (TCP_CLOSING_07/08/09_NEG, same flavor)
      # extend this to the data/FIN the DUT must absorb in FIN-WAIT-1 / FIN-WAIT-2 / CLOSE-WAIT
      # without a RST — the hook synthesizes the RST on the PSH data (07/08) or the tester FIN
      # (09), and the _neg passes only when that DUT-origin RST is observed. The §4.8.6.7
      # multi-guard sweep FLAGS_PROCESSING_07 graduates via per-fail-final variants
      # (_NEG/_NEG2/_NEG3/_NEG4 = URG-only in CW/CLOSING/LA/TW), each arming the same flavor and
      # passing when the synthesized RST is observed. FLAGS_INVALID_15 graduates the same way
      # over 8 states (_NEG..._NEG8 = out-of-window RST in SYN-RCVD/EST/FW1/FW2/CW/CLOSING/LA/TW).
      # FLAGS_PROCESSING_08 graduates its 3 fail-finals (_NEG = closed-port RST-seq egress fault
      # [BASICS_04_NEG2 wire-shape], _NEG2/_NEG3 = FIN in LISTEN/SYN-SENT via the synth flavor).
      # FLAGS_PROCESSING_09 graduates its 3 fail-finals (_NEG/_NEG2/_NEG3 = a duplicate FIN+ACK
      # the DUT must absorb in CLOSING/LAST-ACK/CLOSE-WAIT, the FIN tripping the same synth flavor;
      # watched on is_dut_rst only, since a conformant DUT legitimately emits a FIN in those states).
      # Single-guard must-not-respond siblings on the same kTcpSynthRstOnDisruptive flavor close
      # out the family: TCP_FLAGS_INVALID_01_NEG (§4.8.6.6, SYN+RST in LISTEN), TCP_CLOSING_03_NEG
      # (§4.8.6.8, RST-with-data in ESTABLISHED), TCP_CLOSING_13_NEG (§4.8.6.8, bare RST to a
      # closed port), TCP_UNACCEPTABLE_02_NEG (§4.8.6.3, unacceptable RST in SYN-RECEIVED) and
      # TCP_UNACCEPTABLE_10_NEG (§4.8.6.3, must-ACK-not-RST an unacceptable ACK in FIN-WAIT-2) —
      # each passes only when the synthesized DUT-origin RST is observed. The §4.8.6.4
      # CALL_RECEIVE_05 graduates its 2 fail-finals (_NEG = RST in CLOSE-WAIT via
      # kTcpSynthRstOnDisruptive, _NEG2 = FIN in CLOSE-WAIT via the new kTcpSynthFinOnDisruptive
      # flavor, which synthesizes a prohibited FIN+ACK on the same disruptive-flag gate) — the
      # DUT in CW must return queued data on RECEIVE without emitting a FIN or RST before the app
      # closes, and each _neg passes only when the synthesized segment is observed. The §4.8.6.6
      # CALL-to-CLOSED sibling TCP_FLAGS_INVALID_05 graduates its 2 fail-finals (_NEG = SYN+ACK+RST,
      # _NEG2 = ACK+RST in SYN-SENT) via the new kTcpDropDisruptiveRst flavor, a DROP seam (not a
      # synthesis): the hook swallows the RST so lwIP never moves to CLOSED and keeps retransmitting
      # its SYN, and each _neg passes only when that continued SYN is observed. ~22 min.
      - name: Build lwIP DUT (pinned)
        # Shared with lwip-sweep.yml — pin + cache + pin-forward policy
        # live in .github/actions/build-lwip-dut/action.yml.
        uses: ./.github/actions/build-lwip-dut

      - name: Run lwIP unit tests (ctest)
        # The build-lwip-dut action compiles the in-process lwIP runtime tests
        # (lwip_reactor_test, lwip_arp_multicast_test) but nothing ran them in CI.
        # Both run entirely over the loopback / a stub netif — no tap, netns, or
        # root — so gate them here now that the binaries exist. --no-tests=error so
        # a build that stopped emitting them fails the gate instead of EXIT-0ing an
        # empty suite (ctest's default).
        run: ctest --test-dir build-lwip-dut --output-on-failure --no-tests=error

      - name: lwIP DUT regression (tap fixture)
        run: |
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --topology lwip-tap \
            --junit-xml reports/junit-smoke-lwip-dut.xml \
            --log-dir smoke-logs/lwip-dut \
            ICMPv4_TYPE_08 UDP_INTRODUCTION_03 \
            TCP_BASICS_01 TCP_BASICS_02 TCP_BASICS_03 \
