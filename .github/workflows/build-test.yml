name: build-test

on:
  push:
    branches: [main]
    # Skip pure-site / pcap-tooling pushes — none of those affect C++
    # behaviour, so the hosted build + ctest gate would just waste
    # runner time.
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
      - 'docs/spec/deprecated_cases.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
      - 'docs/spec/deprecated_cases.json'

# A newer push/PR-update to the same ref cancels an older in-flight run of THIS
# workflow — the verdict only cares about HEAD, and a superseded run would
# otherwise pin a runner (the self-hosted smoke host for ~1 h). Per-workflow
# group (github.workflow) so build-test never cancels smoke-test or mnemosyne.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + ctest + spec-coverage gate
    runs-on: ubuntu-22.04
    env:
      # Embed SCE via third_party/sce/ instead of find_package; no
      # external SCE install needed. Keeps CI self-contained on a
      # stock Ubuntu runner.
      CMAKE_GENERATOR: Unix Makefiles
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install apt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            quilt \
            clang-format-15 \
            libpcap-dev \
            libtins-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-filesystem-dev \
            libboost-log-dev \
            pkg-config \
            git
          # SCE codegen post-formats generated C++ via clang-format and
          # the third_party/sce/tools/codegen/default.clang-format style
          # uses the `InsertBraces` option introduced in LLVM 15. Ubuntu
          # 22.04 ships clang-format-14 by default; force-symlink so
          # `find_program(clang-format)` always resolves to 15+.
          sudo ln -sf /usr/bin/clang-format-15 /usr/bin/clang-format
          clang-format --version

      - name: Cache vsomeip (patched) + CommonAPI builds
        id: cache-someip-deps
        uses: actions/cache@v5
        with:
          path: |
            /opt/someip-stack
          # Cache key folds in (a) the pinned vsomeip submodule SHA via
          # .gitmodules, (b) the quilt patch series + every patch body,
          # and (c) the CommonAPI tag pair. Any of those changing
          # invalidates the cache and forces a rebuild — that's what
          # keeps RPC_07/_08 (which depend on patches/vsomeip/0001-*)
          # honest across PRs.
          key: someip-stack-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'patches/vsomeip/series', 'patches/vsomeip/*.patch') }}-capi3.2.0

      - name: Build & install patched vsomeip + CommonAPI from source
        if: steps.cache-someip-deps.outputs.cache-hit != 'true'
        run: |
          # vsomeip is vendored via third_party/vsomeip (submodule) and
          # patched in place by patches/vsomeip/series before build.
          # CommonAPI core + CommonAPI-SomeIP remain upstream tarballs
          # because we don't patch them. All three install to
          # /opt/someip-stack so CMAKE_PREFIX_PATH stays single-rooted.
          sudo mkdir -p /opt/someip-stack
          sudo chown "$USER" /opt/someip-stack

          # vsomeip via setup-vsomeip.sh (idempotent quilt push + cmake).
          # VSOMEIP_INSTALL_PREFIX overrides the script's /usr/local
          # default so CI builds land alongside CommonAPI.
          sudo VSOMEIP_INSTALL_PREFIX=/opt/someip-stack ./scripts/setup-vsomeip.sh

          export CMAKE_PREFIX_PATH=/opt/someip-stack
          mkdir -p ~/work && cd ~/work

          git clone --depth=1 --branch 3.2.0 \
            https://github.com/COVESA/capicxx-core-runtime.git
          cmake -S capicxx-core-runtime -B capicxx-core-runtime/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/someip-stack
          cmake --build capicxx-core-runtime/build -j4
          sudo cmake --install capicxx-core-runtime/build

          git clone --depth=1 --branch 3.2.0 \
            https://github.com/COVESA/capicxx-someip-runtime.git
          cmake -S capicxx-someip-runtime -B capicxx-someip-runtime/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/someip-stack \
            -DCMAKE_PREFIX_PATH=/opt/someip-stack
          cmake --build capicxx-someip-runtime/build -j4
          sudo cmake --install capicxx-someip-runtime/build

      - name: Cache sce-codegen binary
        id: cache-sce-codegen
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/sce-codegen
          # SCE Rust codegen binary lives outside the embed/ snapshot
          # (Rust toolchain, not C++); we build it from upstream
          # newmassrael/scxml-core-engine at the SHA pinned in
          # third_party/sce/VERSION. Cache hit when VERSION is unchanged.
          key: sce-codegen-${{ runner.os }}-${{ hashFiles('third_party/sce/VERSION') }}

      - name: Build & install sce-codegen from upstream SCE
        if: steps.cache-sce-codegen.outputs.cache-hit != 'true'
        run: |
          SCE_REV=$(tr -d '[:space:]' < third_party/sce/VERSION)
          git clone https://github.com/newmassrael/scxml-core-engine.git "$HOME/sce-src"
          git -C "$HOME/sce-src" checkout "$SCE_REV"
          cargo build --release \
            --manifest-path "$HOME/sce-src/sce-build/Cargo.toml" \
            --bin sce-codegen --features cli
          mkdir -p "$HOME/.local/bin"
          install "$HOME/sce-src/target/release/sce-codegen" "$HOME/.local/bin/"

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure (embed SCE)
        run: |
          export CMAKE_PREFIX_PATH=/opt/someip-stack:$CMAKE_PREFIX_PATH
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTC8_SCE_FIND_PACKAGE=OFF \
            -DTC8_BUILD_MOCK_DUT=OFF

      - name: Build tc8-harness + unit tests
        run: cmake --build build -j4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -j4

      - name: Suite producer configure gate
        # Configures the harness with examples/demo-suite injected under suite
        # "demo" (which reuses an in-tree case id) — no compile, so it is cheap.
        # This fires the configure-time guards: the sce-codegen
        # --cpp-namespace-prefix probe (a stale codegen that silently ignores the
        # flag FATALs here), suite-name validation, the SUITES/DIRS length-
        # alignment check, and the suite-aware collision logic. The full
        # link/coexistence proof runs on the self-hosted smoke job
        # (scripts/check-suite-producer.sh).
        run: |
          export CMAKE_PREFIX_PATH=/opt/someip-stack:$CMAKE_PREFIX_PATH
          cmake -S . -B build-suite-cfg \
            -DCMAKE_BUILD_TYPE=Release \
            -DTC8_SCE_FIND_PACKAGE=OFF \
            -DTC8_BUILD_MOCK_DUT=OFF \
            -DTC8_EXTRA_CASE_DIRS="$PWD/examples/demo-suite" \
            -DTC8_EXTRA_CASE_SUITES=demo

      - name: Verdict donedata SSOT gate
        # Enforces the single-source verdict invariant in two layers:
        #  1. the taxonomy + role policy generated mirrors (python/bash/doc) are
        #     fresh w.r.t. src/sce_integration/verdict_taxonomy.def (the source
        #     also #included by verdict.h), so C++/python/bash cannot diverge;
        #  2. every registered case carries a donedata verdict whose class
        #     matches its declared role under that policy.
        # Pure-Python, no spec corpus needed.
        run: |
          python3 tools/gen_verdict_taxonomy.py --check
          python3 tools/verdict_drift_audit.py

      - name: Negative-coverage exhaustiveness ratchet
        # Every positive case must carry a non-vacuity DISPOSITION proving its
        # guard is checkable: a sound expect-flip row, a fault-injection _neg
        # case, a conformant-absence registry entry, or a tracked deferral. The
        # ratchet enforces: registry structurally valid; no STALE row; no NEW
        # undisposed case beyond the shrinking ledger
        # (tools/negative_coverage_undisposed.txt, D7); no stale ledger entry.
        # Pure-Python. See docs/verdict_policy.md Section 6.
        run: python3 tools/negative_coverage_audit.py --check

      - name: Wire-constant manifest SSOT gate
        # The wire/fixture constants (IPs, MACs, tap/lock names, backstop) are
        # generated from tools/wire.def into wire.gen.{rs,sh}, and
        # the generator cross-checks the C++ stimulus headers (arp_builder.h,
        # icmpv4_builder.h, udp_pilot_common.h, dhcpv4_default_endpoints.h) against
        # it. --check fails on a stale mirror OR a C++ value drift. Pure-Python.
        run: python3 tools/gen_wire_manifest.py --check

      - name: SOME/IP-SD wire-decode SSOT gate
        # The SD wire field layout (entry/option offsets, widths, bit slices)
        # lives once in src/sce_integration/someip_sd_wire.def. The C++
        # authoritative decoder (someip_captured.h) #includes it directly, and
        # this tool generates the Python site mirror
        # (site/scripts/someip_sd_wire_generated.py). --check fails on a stale
        # mirror AND runs a golden-vector self-test that catches a wrong
        # offset/width in the .def. Pure-Python. See docs/tech-debt.md TD-01.
        run: python3 tools/gen_someip_sd_wire.py --check

      - name: DHCPv4 BOOTP wire-decode SSOT gate
        # The BOOTP fixed-header layout (op..chaddr offsets + magic cookie)
        # lives once in src/sce_integration/dhcpv4_wire.def. The C++
        # authoritative decoder (dhcpv4_wire.h, used by packet_pipeline.cpp)
        # #includes it directly, and this tool generates the Python site mirror
        # (site/scripts/dhcpv4_wire_generated.py). --check fails on a stale
        # mirror AND runs a golden-vector self-test that catches a wrong
        # offset/width in the .def. Pure-Python. See docs/tech-debt.md TD-02.
        run: python3 tools/gen_dhcpv4_wire.py --check

      - name: DUT identity cross-check gate
        # The DUT's primary + secondary identity (service/instance/ports/unicast IP/
        # SD-multicast/app-name) is written by hand across 8 artifacts that MUST
        # agree: include/tc8/dut_config.h + src/sce_integration/someip_method_dest.h
        # (C++), the 4 dut/dut_service/vsomeip*.json deployments, and dut/ets/
        # {ets,ets2}.fdepl (CommonAPI). No single SUPERSET source exists to generate
        # from (distinct formats; each carries something the others don't), so this
        # is a file-specific cross-check that fails on any drift. Pure-Python.
        # See include/tc8/dut_config.h.
        run: python3 tools/check_dut_identity.py --check

      - name: --expect key schema SSOT gate
        # Every accepted --expect key + its kind + its group prefix lives once in
        # src/cli/tc8_expect_keys.def; expect_parser.cpp is GENERATED from it
        # (cannot drift/omit). This checks the hand-written producers
        # (orchestrator dispatch.rs, smoke-test.sh, dut_identity.py) emit only
        # keys present in that registry, so none is silently dropped by the
        # consumer to a zero sentinel. Pure-Python. See docs/tech-debt.md TD-03.
        run: python3 tools/check_expect_keys.py

      - name: timing_serial cadence-lane drift gate
        # Every sub-second cadence case (*_within_us predicate) must be classified
        # for the smoke serial lane (timing_serial:true in inventory_overrides, or
        # EXEMPT with a window-margin reason). Catches a new cadence case that would
        # silently join the contended --workers 4 lane and flake. Pure-Python.
        run: python3 tools/timing_serial_audit.py

      - name: Re-mine spec inventory and verify it matches checked-in copy
        # Skipped on CI runners that don't have the TC8 spec PDF split
        # output (`docs/spec/split/*.txt` is gitignored — see LICENSE
        # discussion in README.md). Local dev runs this from a tree
        # that has the split corpus.
        run: |
          if [ -z "$(ls docs/spec/split/*.txt 2>/dev/null)" ]; then
            echo "spec split corpus absent — skipping drift gate (CI/public-tree only)"
            exit 0
          fi
          python3 tools/extract_spec_inventory.py --out /tmp/spec_inv.json
          diff -u docs/spec/case_inventory.json /tmp/spec_inv.json

      - name: Spec-coverage gate (--list-cases --vs-spec --strict)
        # Fails the build when expected spec cases are unregistered.
        # Coverage is 543 / 543 active (100 %), deferred = 0 as of
        # 2026-05-03 (see memory/project_deferral_closeout_2026_05_03.md);
        # any future spec-inventory drift must either register the case
        # or land an explicit `expected:false` override in
        # docs/spec/inventory_overrides.json.
        run: ./build/tc8-harness test --list-cases --vs-spec --strict
