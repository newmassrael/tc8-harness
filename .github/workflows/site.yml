name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/sce_integration/cases/**'
      - 'tests/**/*.scxml'
      - 'doc/spec/case_inventory.json'
      - 'doc/spec/inventory_overrides.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: sanitize + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pre-deploy guard: any captured packet field that looks like real
      # vendor MAC / public IP fails the build before publishing.
      - name: Sanitize pcap captures
        run: python3 site/scripts/sanitize_pcap.py site/src/data/pcap

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          # GH Pages serves under https://<user>.github.io/<repo>/ — base
          # path inferred from the repository name keeps internal links
          # correct without hard-coding "tc8-harness".
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
