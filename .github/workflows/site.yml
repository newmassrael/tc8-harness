name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/sce_integration/cases/**'
      - 'tests/**/*.scxml'
      - 'docs/spec/case_inventory.json'
      - 'docs/spec/inventory_overrides.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: sanitize + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Per-case captures live on the orphan `pcap-data` branch (decoupled
      # from main so timestamp churn from refresh runs stays out of the
      # codebase log). Overlay them onto site/src/data/pcap/ before
      # sanitize so the build sees them as if they were on main.
      # ``continue-on-error`` keeps the workflow alive on first deploy
      # before the branch is seeded.
      - name: Pull pcap-data branch
        uses: actions/checkout@v5
        with:
          ref: pcap-data
          path: .pcap-overlay
        continue-on-error: true

      - name: Overlay pcap data
        run: |
          mkdir -p site/src/data/pcap site/src/data/auto_messages
          if [ -d .pcap-overlay/site/src/data/pcap ]; then
            cp -r .pcap-overlay/site/src/data/pcap/. site/src/data/pcap/
            echo "overlaid $(ls site/src/data/pcap | wc -l) capture file(s)"
          else
            echo "pcap-data branch empty or absent; skipping overlay"
          fi
          if [ -d .pcap-overlay/site/src/data/auto_messages ]; then
            cp -r .pcap-overlay/site/src/data/auto_messages/. site/src/data/auto_messages/
            echo "overlaid $(ls site/src/data/auto_messages | wc -l) auto-message file(s)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pre-deploy guard: any captured packet field that looks like real
      # vendor MAC / public IP fails the build before publishing.
      - name: Sanitize pcap captures
        run: python3 site/scripts/sanitize_pcap.py site/src/data/pcap

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          # GH Pages serves under https://<user>.github.io/<repo>/ — base
          # path inferred from the repository name keeps internal links
          # correct without hard-coding "tc8-harness".
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
