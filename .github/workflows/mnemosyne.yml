name: mnemosyne

# Mnemosyne 어댑션 게이트 — R400 store-only model (atomic store = 단일 SSOT).
# 잡 내용:
#   1. validate-workspace  — T1 cross-ref orphan reject + style + atomic ledger
#   2. validate-code-refs  — § / inventory 인용 정합성 (severity = reject)
#
# 어떤 단계든 exit != 0 이면 잡 실패. PR 의 코드 코멘트가 stale §<id> 나
# deprecated TC ID 를 도입하면 머지 차단됨.
# (verify-generated 단계는 업스트림 R400 이 GENERATED.md 렌더 아티팩트를
# 퇴역시키면서 함께 퇴역 — 2026-06-11 M1 마이그레이션.)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'

# A newer push/PR-update to the same ref cancels an older in-flight run of THIS
# workflow — the verdict only cares about HEAD, and a superseded run would
# otherwise pin a runner (the self-hosted smoke host for ~1 h). Per-workflow
# group (github.workflow) so mnemosyne never cancels build-test or smoke-test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate-workspace + validate-code-refs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # The pinned revision is NOT written here — `[tool] pin` in mnemosyne.toml
      # is its single home, because that is the value the CLI itself enforces at
      # config load (upstream R826). Repeating it in a cache key and an install
      # flag is how the pin and the local CLI drifted in the first place, so both
      # read it from the workspace instead. Fails the job when it is absent or
      # too short to name one commit (git's 7-hex abbreviation floor).
      - name: Resolve the pinned mnemosyne rev
        id: pin
        run: |
          set -euo pipefail
          rev=$(sed -n '/^\[tool\]/,/^\[/{s/^pin *= *"\([0-9a-fA-F]\{7,\}\)".*/\1/p;}' \
              mnemosyne.toml)
          if [ -z "$rev" ]; then
            echo "mnemosyne.toml: [tool] pin missing, or not >=7 hex chars" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "pinned mnemosyne rev: $rev"

      - name: Cache cargo install of mnemosyne-cli
        id: cache-mnemosyne
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/mnemosyne-cli
          key: mnemosyne-cli-${{ runner.os }}-${{ steps.pin.outputs.rev }}

      # After the cache step, not before: this condition reads its output, and a
      # forward reference silently evaluates to empty — which made the apt
      # install run on every hit.
      - name: Install protoc (mnemosyne-server build dep)
        if: steps.cache-mnemosyne.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install mnemosyne-cli (cache miss only)
        if: steps.cache-mnemosyne.outputs.cache-hit != 'true'
        # The pin was last moved to upstream 27396a9, 108 commits forward of
        # eaeedbb6 (itself a pin-forward from f71306b7, which rejected the local
        # atomic-store schema 39 with "expected <= 23"). The bump reason: the
        # round that made an unscanned tree loud added the citation-gate coverage
        # check — every Rust source must be scanned or explicitly excluded. It
        # fired locally on tools/verdict_migrate/, blocking every commit, while
        # CI stayed green because the old pin has no such check. A gate the local
        # hook enforces and CI does not is drift in the invisible direction.
        #
        # Before bumping `[tool] pin`: confirm the target is a descendant of the
        # current one, install it locally (the workspace refuses a binary that is
        # not it), and run BOTH validators below against this store — a bump
        # interval can add validators, and any of them can reject a store CI has
        # never seen.
        run: |
          cargo install --git https://github.com/newmassrael/mnemosyne \
            --rev '${{ steps.pin.outputs.rev }}' mnemosyne-cli

      - name: validate-workspace
        run: mnemosyne-cli validate-workspace

      - name: validate-code-refs
        run: mnemosyne-cli validate-code-refs
