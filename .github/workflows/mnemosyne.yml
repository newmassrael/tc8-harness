name: mnemosyne

# Mnemosyne 어댑션 게이트 — R400 store-only model (atomic store = 단일 SSOT).
# 잡 내용:
#   1. validate-workspace  — T1 cross-ref orphan reject + style + atomic ledger
#   2. validate-code-refs  — § / inventory 인용 정합성 (severity = reject)
#
# 어떤 단계든 exit != 0 이면 잡 실패. PR 의 코드 코멘트가 stale §<id> 나
# deprecated TC ID 를 도입하면 머지 차단됨.
# (verify-generated 단계는 업스트림 R400 이 GENERATED.md 렌더 아티팩트를
# 퇴역시키면서 함께 퇴역 — 2026-06-11 M1 마이그레이션.)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'

# A newer push/PR-update to the same ref cancels an older in-flight run of THIS
# workflow — the verdict only cares about HEAD, and a superseded run would
# otherwise pin a runner (the self-hosted smoke host for ~1 h). Per-workflow
# group (github.workflow) so mnemosyne never cancels build-test or smoke-test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate-workspace + validate-code-refs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (mnemosyne-server build dep)
        if: steps.cache-mnemosyne.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo install of mnemosyne-cli
        id: cache-mnemosyne
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/mnemosyne-cli
          # Pin to upstream commit so the gate is reproducible. Bump when
          # adopting a newer Mnemosyne (e.g., when a Round NN fix is needed).
          key: mnemosyne-cli-${{ runner.os }}-27396a9

      - name: Install mnemosyne-cli (cache miss only)
        if: steps.cache-mnemosyne.outputs.cache-hit != 'true'
        # 27396a9 = upstream HEAD at adoption, 108 commits forward of the
        # previous pin eaeedbb6 (mnemosyne-engine + render; itself a pin-forward
        # from f71306b7, which rejected the local atomic-store schema 39 with
        # "expected <= 23"). The locally installed CLI was moved to the same rev
        # in the same change, so both sides judge with one binary.
        #
        # Bump reason: the round that made an unscanned tree loud added the
        # citation-gate coverage check — every Rust source must be scanned or
        # explicitly excluded. It fired locally on tools/verdict_migrate/,
        # blocking every commit, while CI at eaeedbb6 stayed green because that
        # pin has no such check. A gate the local hook enforces and CI does not
        # is drift in the invisible direction.
        #
        # Policy: the pin and the local CLI move together, and the pin never
        # runs ahead of a rev exercised here. Before bumping: confirm the target
        # is a descendant of the current pin, install it locally, and run BOTH
        # validators below against this store — the interval added several new
        # validators (exclusion integrity, fact-id citations, quote re-resolve),
        # any of which can reject a store CI has never seen.
        run: |
          cargo install --git https://github.com/newmassrael/mnemosyne \
            --rev 27396a9 mnemosyne-cli

      - name: validate-workspace
        run: mnemosyne-cli validate-workspace

      - name: validate-code-refs
        run: mnemosyne-cli validate-code-refs
