name: pcap-refresh

# Runs the full positive-smoke set with `--log-dir` to capture pcaps,
# decodes each one to the site's PacketCapture JSON shape, and pushes
# the result to the orphan `pcap-data` branch. The site workflow then
# overlays those captures during build (see site.yml).
#
# Manual-only for now (no schedule). The maintainer triggers this when
# the test logic, the DUT firmware, or vsomeip patch series has changed
# enough to warrant fresh on-the-wire evidence on the case pages.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Optional commit message suffix shown in pcap-data log'
        required: false
        default: ''

permissions:
  contents: write   # push to pcap-data branch
  actions: write    # trigger site.yml after pushing

jobs:
  refresh:
    name: capture + decode + push
    # Same self-hosted netns runner as smoke-test.yml — needs sudo
    # NOPASSWD for setup-vsomeip.sh + dut/env/smoke-test.sh + cmake.
    runs-on: [self-hosted, netns]
    # Cold path: vsomeip rebuild + harness build + 543-case smoke run +
    # decode + push ≈ 30 min. Set the cap high enough to absorb the
    # cold path and rely on test logic to bound runtime.
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      # Steer find_package(vsomeip3) to the job-scoped install — the runner
      # host's /usr/local may carry an operator-managed SOME/IP stack that
      # CI must neither overwrite nor silently load (see build-harness).
      CMAKE_PREFIX_PATH: /opt/someip-stack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply vsomeip patch series + reinstall (idempotent)
        run: sudo -n ./scripts/setup-vsomeip.sh /opt/someip-stack

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTC8_SCE_FIND_PACKAGE=OFF

      - name: Build harness + tc8-dut
        run: cmake --build build -j4

      - name: Build orchestrator (drives the capture)
        working-directory: dut/env/orchestrator
        run: cargo build

      - name: Capture pcaps for the active spec
        # `|| true` lets known-deviating cases (Linux DUT vs strict-RFC,
        # see smoke-test.yml comment) fail without aborting the refresh
        # — the pcap files are still produced and useful for the page
        # timeline regardless of pass/fail outcome.
        run: |
          mkdir -p /tmp/pcap-logs
          sudo -n dut/env/orchestrator/target/debug/tc8-orchestrator \
            --workers 4 \
            --log-dir /tmp/pcap-logs \
            --junit-xml /tmp/pcap-logs/junit.xml \
            $(./build/tc8-harness test --list-cases --exclude-deferred \
              | awk '/^  [A-Z]/{print $1}') || true
          echo "captured $(ls /tmp/pcap-logs/*.pcap 2>/dev/null | wc -l) pcap file(s)"

      - name: Pull pcap-data branch
        uses: actions/checkout@v5
        with:
          ref: pcap-data
          path: .pcap-data

      - name: Decode pcaps to PacketCapture JSON
        # `tc8-harness decode-pcap` replays each saved pcap through the
        # harness's own authoritative wire decoder (src/dissect +
        # *_captured.h) — the single decoder, no second Python one (see
        # docs/tech-debt.md TD-05). It auto-detects tester/DUT MAC+IP from
        # the first frames (the harness assigns random locally-administered
        # MACs per veth pair, so static fixture values would not match a
        # live capture). Outcome is derived per-case from the JUnit XML
        # produced by the smoke run above so Linux-known-fail cases
        # (e.g. IPV4_REASSEMBLY_11/_13) land with a 'fail' badge on
        # their packet timeline. Cases not present in the XML default
        # to 'pass' (pcap capture succeeded but no JUnit row).
        run: |
          set -e
          shopt -s nullglob
          # Wipe existing JSON so removed/renamed cases don't linger.
          # Re-creating identical content produces no git diff.
          rm -f .pcap-data/site/src/data/pcap/*.json
          mkdir -p .pcap-data/site/src/data/pcap

          # Build {case_id: outcome} map from junit.xml. junit_outcomes.py
          # skips _NEG rows so a passing negative case won't overwrite the
          # positive outcome (pcap files are keyed by positive case_id).
          declare -A OUTCOMES
          if [[ -s /tmp/pcap-logs/junit.xml ]]; then
            while IFS=$'\t' read -r cid outcome; do
              [[ -n "$cid" ]] && OUTCOMES["$cid"]="$outcome"
            done < <(python3 site/scripts/junit_outcomes.py /tmp/pcap-logs/junit.xml)
            echo "junit outcomes parsed: ${#OUTCOMES[@]} case(s)"
          else
            echo "::warning::no junit.xml — every pcap will default to pass"
          fi

          decoded=0
          failed=0
          captured_at="$(date -u +%FT%TZ)"
          for pcap in /tmp/pcap-logs/*.pcap; do
            name=$(basename "$pcap" .pcap)
            cid=${name^^}
            outcome="${OUTCOMES[$cid]:-pass}"
            # Evidence Export — harness emits <pcap>.trace.json alongside
            # every retained .pcap. decode-pcap merges the trace verbatim
            # under ``captured_trace`` so the site walker renders the
            # timeline from the harness's recorded transitions (single SSOT).
            trace="${pcap%.pcap}.trace.json"
            trace_arg=()
            [[ -s "$trace" ]] && trace_arg=(--trace-json "$trace")
            if ./build/tc8-harness decode-pcap "$cid" "$outcome" "$pcap" \
                 --captured-at "$captured_at" \
                 "${trace_arg[@]}" \
                 --out ".pcap-data/site/src/data/pcap/${cid}.json"; then
              decoded=$((decoded+1))
            else
              failed=$((failed+1))
              echo "::warning::decode failed for $cid ($pcap)"
            fi
          done
          echo "decoded=$decoded failed=$failed"

      - name: Sanitize captures
        run: python3 site/scripts/sanitize_pcap.py .pcap-data/site/src/data/pcap

      - name: Trim oversize captures
        # GitHub rejects files >100 MB. SOMEIP_ETS_152's wrap-around test
        # bursts ~100k SubscribeEventgroup frames in ~150s, producing a
        # ~155 MB decoded JSON. Cap to head + tail with a synthetic
        # ``[truncated]`` marker so the site timeline still renders the
        # informative portions without tripping the repo file-size limit.
        run: python3 site/scripts/trim_pcap.py .pcap-data/site/src/data/pcap

      - name: Auto-generate per-packet messages
        # ``build_manifest.py`` materialises ``site/src/data/cases/*.json``
        # (each carrying the inlined SCXML) from the trait headers + .scxml
        # files. Those manifests aren't tracked in git, so a fresh
        # ``actions/checkout`` doesn't have them — without this step the
        # generator silently skips every case (cases dir empty).
        # Then walk every freshly-decoded pcap, parse the inlined SCXML
        # in the manifest, and emit per-idx role/label JSON files
        # alongside the captures on the pcap-data branch. The site
        # overlays both at build time; ``localizedMessages`` merges
        # these auto labels with hand-written locale overrides at idx
        # granularity (manual wins).
        run: |
          set -e
          python3 site/scripts/build_manifest.py
          rm -rf .pcap-data/site/src/data/auto_messages
          mkdir -p .pcap-data/site/src/data/auto_messages
          python3 site/scripts/generate_messages.py \
            --cases-dir site/src/data/cases \
            --pcap-dir .pcap-data/site/src/data/pcap \
            --out-dir .pcap-data/site/src/data/auto_messages

      - name: Commit + push to pcap-data
        working-directory: .pcap-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/pcap/ site/src/data/auto_messages/
          if git diff --staged --quiet; then
            echo "no pcap changes — skipping commit"
            exit 0
          fi
          suffix=""
          if [ -n "${{ github.event.inputs.message }}" ]; then
            suffix=" — ${{ github.event.inputs.message }}"
          fi
          git commit -m "chore(pcap): Refresh captures from run ${{ github.run_id }}${suffix}"
          git push origin pcap-data

      - name: Trigger site rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site.yml --ref main
