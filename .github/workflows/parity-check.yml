name: parity-check

# Strangler parity gate — diffs the Rust tc8-orchestrator against bash
# smoke-test.sh over a shared case set (dut/env/orchestrator/parity-check.sh).
# Behavioral equivalence is the precondition for ever deleting smoke-test.sh, so
# this accrues evidence as the orchestrator ports stages; make it a required
# gate at the final cutover.
#
# Runs non-gating on every push to main (a red parity-check does not block the
# push — it accrues evidence until the cutover, when it becomes a required gate).
# The orchestrator's NOPASSWD sudoers entry on the self-hosted runner is
# provisioned, so `sudo -n tc8-orchestrator` works alongside smoke-test.sh's.
#
# Self-hosted, so NO pull_request trigger — a fork PR could otherwise run
# arbitrary code on the runner host (same rule as smoke-test.yml). Only
# maintainer-controlled push-to-main / manual dispatch. The single self-hosted
# runner serializes jobs, so this never races smoke-test.yml over the shared
# netns names.
on:
  push:
    branches: [main]
    # Pure-site / pcap-tooling pushes cannot change driver parity — skip them,
    # mirroring smoke-test.yml.
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/pcap-refresh.yml'
      - 'docs/spec/deprecated_cases.json'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: orchestrator vs smoke-test.sh parity on self-hosted [netns]
    runs-on: [self-hosted, netns]
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build harness (vsomeip + cmake)
        uses: ./.github/actions/build-harness

      - name: Build orchestrator
        working-directory: dut/env/orchestrator
        run: cargo build

      - name: Parity diff — positive (one+ per category + tricky cases)
        run: dut/env/orchestrator/parity-check.sh

      # The orchestrator now ports --negative (the authored expect-flip rows), so
      # gate its parity too: a representative sample across the verdict arms (a
      # SOME/IP field flip, an ARP identity flip, a guard-not-exercised skip, and a
      # row carrying neg_expect_overrides). Same disposition-diff mechanism.
      - name: Parity diff — negative rows
        run: dut/env/orchestrator/parity-check.sh --negative
