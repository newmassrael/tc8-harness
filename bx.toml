schema = 1

# What tc8-harness needs from a build machine — REQUIREMENTS, never a machine name.
#
# WHY THIS FILE EXISTS. Without a declaration nothing says what to send or what
# this repository needs, so bx ran every build on the developer's own machine —
# the same machine that hosts the `[self-hosted, netns]` smoke runner, so this
# repository was competing with its own push gate. Measured 2026-09-24: a
# cache-warm harness build inside the gate took 59m03 against 8m14 on a quiet run,
# and the gate returned no verdict (docs/tech-debt.md TD-43).
#
# ⚠ Until then the only thing keeping the two apart was a HABIT -- "keep quiet
# after a push". A habit is not a mechanism. This file is the mechanism.
#
# ⚠⚠ THE REMOTE TREE IS A READ-ONLY VERIFICATION COPY. Commits, the mnemosyne
# citation gate and pushes are local by rule; anything edited over there is erased
# by the next rsync.

# Tracked files, WITHOUT submodules, and both halves of that were measured.
#
# The one submodule is `third_party/vsomeip`, and the build below does not consume
# it: the top-level CMake never adds it as a subdirectory, and its own comment
# records that a `-DTC8_BUILD_MOCK_DUT=OFF` configure "needs NONE of this stack
# installed". The CI checkout takes it recursively because that lane also builds
# the mock DUT; this one does not.
#
# ⚠ Sending it is not merely wasteful, it BLOCKS the transfer. The series in
# `dut/env/vsomeip-patches` is applied into the submodule's working tree, so four
# tracked files sit modified there permanently. `bx` compares the two working
# trees and refuses when they differ -- correctly, since a verification copy that
# silently differs from the tree under test proves nothing about it. Reconciling
# would mean committing a vendored upstream's patches, which is not ours to do.
#
# Untracked output (`build/`, `build-remote/`, `target/`, `reports/`,
# `smoke-logs/`) stays home by this choice rather than by an exclude list -- see
# the note at the end.
send = "tracked"

# The executables the commands below invoke. bx asks each host whether it RUNS
# every name here before sending anything, so a host missing one is refused BY
# NAME instead of reddening a lane.
#
# ⚠ `sce-codegen` is deliberately NOT in this list and it is the one that will
# surprise a reader. The generator is not built from the tree: `third_party/sce`
# ships SCEFindCodegen.cmake, which FINDS one on the machine's PATH (`~/.local/bin`),
# and every one of the 543 case state machines is generated by it, so a machine
# without it builds nothing at all. But `needs` only asks whether a command of that
# name RUNS, and the configure-time pin check (cmake/tc8_sce_pin.cmake) refuses a
# generator built from any revision but the vendored one -- so a machine holding an
# older build passed placement and then failed every configure.
#
# Worse, naming it here makes `provision --apply` treat a missing one as a plain
# tool gap and COPY it from whichever machine has one, which restored the stale
# build it had just been cleared of (measured 2026-10-20). `[tools.sce-codegen]`
# below says both things a `needs` entry cannot: the revision, and how to build it.
needs = ["cmake", "make", "g++", "python3", "git"]

# Measured against this repository's own find_package / link requirements rather
# than copied from a sibling. Both are linked, and the tester links libtins for
# every dissector, so a machine without either builds no tester at all.
packages = ["libpcap-dev", "libtins-dev"]

# RAM a machine must have at all. 15, by the owner's decision of 2026-10-28, so the
# 15 GB machines in the fleet take this repository. Measured on such a machine
# (a 14.2 GB run ceiling): one job builds the whole tester and its unit tests at a
# peak of 4.5 GB, so the floor is met with room to spare when the commands below
# size their job count from the grant (scripts/bx-build-jobs.sh). Left to bx's
# jobserver the same machine was ended by its ceiling, so the count is not left
# there.
min_ram_gb  = 15
min_free_gb = 40

# What ONE compile job peaks at, in whole GB; scripts/bx-build-jobs.sh divides a run's
# granted memory by it to get the build's job count, and bx uses it to place a run.
# Measured 2026-10-28 on a 15 GB machine: one job, the whole Release tester and its unit
# tests, peaked at 4.46 GB (the case registrar units are the heavy ones, the generated
# state machines and the tester link run beside them), so 5. The figure had been 3, then
# 4, from averages: 85 GB over 23 jobs on a large machine (3.7 GB a job) hides the peak
# of any one of them. Release since 2026-10-28; the commands set no build type before,
# and a build with none compiles in less memory.
peak_gb_per_task = 5

[commands]
# ⚠ MOCK DUT OFF, deliberately, and this is a real limitation rather than a
# tuning choice. `TC8_BUILD_MOCK_DUT=ON` pulls find_package(CommonAPI) and
# find_package(vsomeip3), and CommonAPI is not something this declaration asks
# a build machine to carry. The
# hosted `build-test` lane already builds this same configuration for the same
# reason, so this is the shape the repository has verified off-box before.
#
# What it therefore does NOT cover: the vsomeip/CommonAPI ETS mock DUT under
# dut/ets. That build stays local until a machine carries CommonAPI.
#
# Release, as every lane that verifies the tree builds it (build-test, the shared
# build-harness action the smoke lane uses). With no build type CMake compiles
# unoptimised. Measured 2026-10-28: a 679 MB tester against Release's 128 MB,
# whose capture-ready signal missed the orchestrator's 5 s barrier on all 15
# cases of a single-pc run, where the Release tester missed it on none of 80.
#
# The job count comes from scripts/bx-build-jobs.sh (the run's granted memory over
# peak_gb_per_task, capped by its granted cores), here and in the commands below.
build  = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTC8_BUILD_MOCK_DUT=OFF -DTC8_BUILD_UNIT_TESTS=ON && cmake --build build -j\"$(bash scripts/bx-build-jobs.sh)\""
# The privileged neighbour test self-wraps in an unprivileged user+net namespace
# and SKIPs (exit 77) where userns is unavailable, so this is safe on a machine
# with no netns provisioning. `--no-tests=error` because ctest EXIT-0s an empty
# suite, which would pass this gate vacuously.
verify = "ctest --test-dir build --output-on-failure --no-tests=error"

# The tester built on a build machine for an on-wire run on this one. The wire
# lanes (single-pc, lwip-tap) need this machine's namespaces and tap devices, so
# only the build goes away: run it as
#   bx --command harness-remote --artifact build-remote/tc8-harness
# and point the orchestrator at what comes back (HARNESS=build-remote/tc8-harness).
# The binary carries no path of the tree it was built in and links only libpcap,
# libtins and the C++ runtime, so it runs here when the two machines' packages
# match; bx's `packages` check names the two libraries.
#
# `build-remote/` and not `build/`: a binary fetched into `build/` would sit beside
# objects it was not linked from, so that tree would no longer hold one build. The
# DUT binaries stay local builds (the mock DUT needs vsomeip and CommonAPI, see
# above); a change that touches them needs `build` here as before.

# The hosted `build-test` job's configuration, for a check before a push: GCC 11
# (the hosted runner's compiler, while these machines default to GCC 13), Release,
# the embedded SCE snapshot and no mock DUT. A tree that builds on GCC 13 can still
# fail there, and one commit stayed red on the hosted job for two days before
# anyone read it. g++-11 is not in `needs`, which would keep every machine without it from
# every build; the command names it first so a machine without it is refused by name.
hosted-ci = "command -v g++-11 && CC=gcc-11 CXX=g++-11 cmake -S . -B build-gcc11 -DCMAKE_BUILD_TYPE=Release -DTC8_SCE_FIND_PACKAGE=OFF -DTC8_BUILD_MOCK_DUT=OFF && cmake --build build-gcc11 -j\"$(bash scripts/bx-build-jobs.sh)\" && ctest --test-dir build-gcc11 --output-on-failure --no-tests=error"

harness-remote = "cmake -S . -B build-remote -DCMAKE_BUILD_TYPE=Release -DTC8_BUILD_MOCK_DUT=OFF -DTC8_BUILD_UNIT_TESTS=ON && cmake --build build-remote -j\"$(bash scripts/bx-build-jobs.sh)\" && ctest --test-dir build-remote --output-on-failure --no-tests=error"

# ⚠ NO `exclude` KEY, and that is deliberate: bx never read one, and bx.toml
# refuses a key bx does not define. Only what git tracks is sent, so the
# untracked build output above stays home without one.

# The generator at the revision this tree vendors. Placement takes only a machine
# whose `~/.local/bin/sce-codegen --version` names the pin, and
# `provision <host> --apply` builds a missing one into the machine's tool store and
# links it there. The revision is read from third_party/sce/VERSION, the file the
# re-vendoring step writes, so a pin bump needs no edit here.
#
# `~/.local/bin` because that is where SCEFindCodegen.cmake finds it (on PATH), the
# same place the hosted `build` job installs it. Only this repository's declaration
# runs that name from PATH; the SCE repository builds its own.
#
# The steps are the script's, shared with the hosted job and the container image, so
# the three cannot build the generator three different ways. VERSION is an input
# because the script reads the revision from it.
[tools.sce-codegen]
version_file    = "third_party/sce/VERSION"
version_pattern = '^([0-9a-f]+)$'
path            = "~/.local/bin/sce-codegen"
install         = "bash scripts/install-sce-codegen.sh {prefix}"
install_inputs  = ["scripts/install-sce-codegen.sh", "third_party/sce/VERSION"]
prefix_file     = "bin/sce-codegen"
