# tc8-harness — Mnemosyne workspace config (adoption 2026-05-12, Round 273-278 substrate)
#
# 평가 사슬: project_mnemosyne_adoption_deferred.md → adopt-ready
# - P0 (multi-prefix TC ID extractor) → inventory_prefixes 8 카테고리
# - P1 (RFC §X.Y skip) → external_section_prefixes = ["RFC"]
# - P2 (TestCase 엔티티) → InventoryEntry (5번째 closed-form, Round 273)
#
# Adoption shape — 하이브리드 (case_inventory.json SSOT 유지 + inventory_entries 는 sync target):
# - docs/spec/case_inventory.json (PDF→python→JSON→C++) → 영구 SSOT
# - inventory_entries (atomic store)            → cite-time 검증 surface

[workspace]
# R400 store-only model (2026-06-11 M1 마이그레이션): 업스트림이 GENERATED.md
# 렌더 아티팩트 + markdown-doc 모델을 퇴역 — atomic store
# (docs/.atomic/workspace.atomic.json) 가 단일 직접-검증 SSOT 이고, 사람은
# `mnemosyne-cli query` 로 읽는다. 구 `docs`/`default_doc` 키는 config 스키마에서
# 삭제됨 (WorkspaceSection = optional `root` + `spec_source` 만).
# TC8 spec 자산 (`docs/spec/*` PDF/JSON) 은 별개 immutable legacy — Mnemosyne 관리 surface 밖.

[schema]
changelog_titles = ["Changelog"]
entry_id_prefix = "Round "
anchor_convention = "section_number"
medium_name = "design_doc"

[style]
locale = "ko"

[style.thresholds]
max_paragraph_length = 1500
max_sentence_length = 400
max_section_body_length = 8000

# TC8 / SOME/IP / SCXML 영문 표기 정착 — 흔한 대소문자 변형 표준화
[terminology.glossary]
"TC8" = ["tc8", "Tc8"]
"SOME/IP" = ["some/ip", "someip", "Some/IP", "SomeIP"]
"SOME/IP-SD" = ["some/ip-sd", "someip-sd", "Some/IP-SD"]
"DHCPv4" = ["dhcpv4", "DHCPV4", "Dhcpv4"]
"DUT" = ["dut", "Dut"]

# 2026-06-10 pin-forward (R291 → R427/a32f2843): `[code_refs]` was the
# pre-R306 name of this table; R306 renamed it in place to
# `[plugins.set_equality_validator]` (no semantic change). CI pin and
# local CLI now both run a32f2843, so only this table exists.
[plugins.set_equality_validator]
paths = [
 "include/",
 "src/",
 "dut/",
 "tests/",
]
# P0: TC8 카테고리. case_inventory.json 정본은 mixed-case (`IPv4_HEADER_05` 등 PDF 그대로)이지만
# 코드에는 UPPERCASE drift 가 공존 — 양 표기 모두 스캔해서 drift 를 InventoryMissing 으로 surface.
# 정본 표기만 inventory_entries 에 시드됨 → drift 표기는 cleanup target (Phase E).
inventory_prefixes = [
 "ARP_",
 "TCP_",
 "UDP_",
 "SOMEIPSRV_",
 "SOMEIP_ETS_",
 # mixed-case (정본 = spec PDF)
 "IPv4_",
 "ICMPv4_",
 "DHCPv4_",
 # UPPERCASE (drift surface)
 "IPV4_",
 "ICMPV4_",
 "DHCPV4_",
]
# P1 axis 1 — <PREFIX> <NUMERIC> §<id> form (RFC 791 §3.1 style, doc number-keyed).
external_section_prefixes = ["RFC"]

# P1 axis 2 (Round 284) — <PREFIX> §<id> form (doc-name-keyed; AUTOSAR family lacks numeric doc id).
# Bare "AUTOSAR" 는 옵트인 안 함 — generic token 이라 internal §<id> 도 silently skip 위험.
# PRS_TPSP (2026-06-12) — AUTOSAR PRS Testability Protocol and Service Primitives
# (Document ID 778, TC 1.2.0); the testability UT-channel code cites its §6.x / §5.1.
# W3C SCXML (2026-06-15) — the SCE-integration .scxml mechanism comments cite the
# W3C SCXML Recommendation by section (e.g. "W3C SCXML §3.13" for transition
# selection); specific multi-word doc name, not a generic token.
# PRS_SOMEIP (2026-06-26) — AUTOSAR FO PRS SOME/IP Protocol (Document ID 696,
# R24-11); the planned SOME/IP-TP transport engine cites its §4.2.1.4 (TP header /
# segmentation; requirements PRS_SOMEIP_00720..731, 00931).
external_section_prefixes_bare = ["TR_SOMEIP", "SOMEIPSD", "SWS_SD", "PRS_TPSP", "W3C SCXML", "PRS_SOMEIP"]
# Phase F 2026-05-13 — baseline 0 도달 후 reject 승격. 새 위반 = build fail.
severity_missing = "reject"
severity_binding = "reject"
severity_inventory = "reject"
# Coverage (ImplementationMissing) stays a warning: this workspace is a
# TC8 spec mirror — auto-seeded prose sections without code bindings are
# legitimate (the R427 schema split severity_coverage out of
# severity_binding for exactly this adoption shape). Current warn
# surface: 7 phantom sections left over from the 2026-06-10
# mis-seeded-binding cleanup (RFC-multiline citations seeded as TC8
# sections at adoption).
severity_coverage = "warn"
comment_only = true

# Round 285 — inventory-axis orphan_ledger 등록. 의도된 historical 인용 (deprecated TC ID)
# 을 explicit whitelist. 새로운 unintended deprecated 인용은 여전히 reject 로 차단됨.

[[orphan_ledger]]
kind = "inventory_citation"
doc  = "src/harness/packet_pipeline.cpp"
from = "src/harness/packet_pipeline.cpp"
to   = "IPv4_OPTIONS_01"
reason = "Historical: IPv4_OPTIONS_01..14 deleted V2→V3, documents why dissector skips IP options"
since  = "2026-05-13 (TC8 adoption Phase E closure)"

[[orphan_ledger]]
kind = "inventory_citation"
doc  = "src/sce_integration/include/sce_integration/ipv4_captured.h"
from = "src/sce_integration/include/sce_integration/ipv4_captured.h"
to   = "IPv4_OPTIONS_01"
reason = "Historical: same rationale as packet_pipeline.cpp:121"
since  = "2026-05-13 (TC8 adoption Phase E closure)"
